          items:
            type: number
    TemplatePermission:
      type: object
      properties:
        message:
          type: string
          enum:
          - NONE
          - VIEW
          - EDIT
          - ADD_REMOVE
          description: 'Controls how users can interact with this part of the template when launching a communication:

            - `NONE` or `VIEW`: Users can use this data but cannot modify it.

            - `EDIT`: Users can modify this data.

            - `ADD_REMOVE`: Users can add or remove this data.'
        settings:
          type: string
          enum:
          - NONE
          - VIEW
          - EDIT
          - ADD_REMOVE
          description: 'Controls how users can interact with this part of the template when launching a communication:

            - `NONE` or `VIEW`: Users can use this data but cannot modify it.

            - `EDIT`: Users can modify this data.

            - `ADD_REMOVE`: Users can add or remove this data.'
        recipients:
          type: string
          enum:
          - NONE
          - VIEW
          - EDIT
          - ADD_REMOVE
          description: 'Controls how users can interact with this part of the template when launching a communication:

            - `NONE` or `VIEW`: Users can use this data but cannot modify it.

            - `EDIT`: Users can modify this data.

            - `ADD_REMOVE`: Users can add or remove this data.'
        publicMessage:
          $ref: '#/components/schemas/PublicMessagePermission'
    CemResultsStringPropertyQuery:
      allOf:
      - $ref: '#/components/schemas/CemResultsPropertyQuery'
      - type: object
        required:
        - type
        description: Provides querying against string properties in Contacts and Assets.
        properties:
          type:
            type: string
            description: Must be set to exactly `String`.
            enum:
