          description: The core content of generic one way.
        receiveUrls:
          type: string
          description: The receive url list of generic one way.
          items:
            type: string
    TextualMessageBody:
      allOf:
      - $ref: '#/components/schemas/LaunchMessageBody'
      - type: object
        required:
        - type
        - content
        - paths
        properties:
          attachments:
            type: array
            description: A set of system-generated IDs representing previously uploaded attachments. Note that attachments are aggregated across all message bodies (i.e. every message body gets the same attachments).
            items:
              type: string
          type:
            type: string
            description: A generic classifier of the message body, further refined by `contentType`. Must be set to exactly `Textual`.
            enum:
            - Textual
          content:
            type: string
            description: Text content to use as the body of the notification message.
          usePrefix:
            type: boolean
            description: If set to true, will prefix the message with organization-specific text prior to including the web page URL. Defaults to false. Currently only applies to message bodies with the `SMS` path category.
          paths:
            type: array
            description: "A set of contact delivery path types that this message body should be sent to.\n*Note*: Textual messages that are delivered to recipients using Audio path categories are read using text-to-speech. Text-to-speech is not available for the following languages:\n * Bengali (`bn_BD`)\n * Hebrew (`he_IL`)\n * Haitian Creole (`ht_HT`)\n * Indonesian (`id_ID`)\n * Thai (`th_TH`)\n * Ukrainian (`uk_UA`)\n * Urdu (`ur_PK`)\n * Vietnamese (`vi_VN`)\n * Yiddish (`yi_US`)"
            items:
              anyOf:
              - $ref: '#/components/schemas/AudioOnlyPathCategory'
              - $ref: '#/components/schemas/TextOnlyPathCategory'
    TemplateCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the template. Must be unique within the current organization. This is the only required field in the create request.
        description:
          type: string
          description: Optional template description. When provided, it must satisfy validation rules.
        category:
          type: string
          description: Optional template category. When provided, it must satisfy validation rules.
        eventTypes:
          type: array
          items:
            type: string
          description: Optional event types for the template. When provided, each value must exist in the event type library.
        status:
          type: string
          enum:
          - DRAFT
          - LIVE
          description: Optional template status. When omitted, the default is DRAFT. When provided, it must be a valid status.
        priority:
          type: string
          description: Optional template priority. When omitted, the default is NORMAL. When provided, it must be a valid priority.
        publicSafety:
          type: boolean
          description: Optional public safety flag. When provided, it must satisfy validation rules.
        variables:
          type: array
          description: Optional template variables. When provided, they must satisfy validation rules.
          items:
            type: object
            properties:
              variableId:
                type: string
                description: The ID of the variable.
              value:
                description: The template-specific default value of the variable. Must be valid based on the variable's definition in the Variable Library.
                oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              permission:
                type: string
                enum:
                - VIEW
                - EDIT
                - ADD_REMOVE
                description: "Permission level for users launching a communication for this template:\n\n * `VIEW`: The variable is read-only to users.\n * `EDIT`: The variable value may be changed prior to launching a communication but the variable may not be removed from the communication.\n * `ADD_REMOVE`: The variable may be removed from the communication prior to launch."
              required:
                type: boolean
                description: If true, then the variable must have a value set to be used in a communication. The value may be set just prior to launch, on the template itself, or within the Variable Library; the value used depends on the `permission` setting.
              type:
                type: string
                enum:
                - CUSTOM
                - CONTEXT
                deprecated: true
                description: "Determines whether or not a variable is from the Variable Library (`CUSTOM`) or from a context (`CONTEXT`).\n\n This field is deprecated and will be removed in a later version of this API."
        settings:
          $ref: '#/components/schemas/ApiSettings'
          description: Optional template settings. When provided, they must satisfy validation rules.
        message:
          $ref: '#/components/schemas/MessageContent'
          description: Optional message content. When provided, it must satisfy validation rules.
        recipients:
          $ref: '#/components/schemas/LaunchRecipients'
          description: Optional recipients. When provided, they must satisfy validation rules.
        publicMessages:
          type: array
          description: Optional public message bodies. When provided, they must satisfy validation rules. Each type at most has one body.
          items:
            anyOf:
            - $ref: '#/components/schemas/WebWidgetPublicMessage'
            - $ref: '#/components/schemas/AlertUsPublicMessage'
            - $ref: '#/components/schemas/GenericOneWayPublicMessage'
            - $ref: '#/components/schemas/AudioBulletinBoardPublicMessage'
            - $ref: '#/components/schemas/SocialMediaPublicMessage'
            - $ref: '#/components/schemas/MemberPortalPublicMessage'
            - $ref: '#/components/schemas/NetworkPublicMessage'
            - $ref: '#/components/schemas/CAPPublicMessage'
        permissions:
          $ref: '#/components/schemas/TemplatePermission'
          description: 'Optional template part permissions. When omitted, defaults are applied: message/settings/recipients default to VIEW, and each publicMessages permission defaults to EDIT.'
        phase:
          type: string
          description: Optional template phase. Valid values are NEW, UPDATE, CLOSE. When provided, it must satisfy validation rules.
