          $ref: '#/components/schemas/organizationId'
      - description: The page number of assets to return.
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          default: '1'
      - description: The page size of assets to return.
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: Sort uploads by field names
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: -createdTimestamp
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUploadBatchResponse'
              examples:
                Success:
                  summary: Success
