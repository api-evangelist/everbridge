    post:
      tags:
      - Asset Upload Batches
      operationId: EBS AM Upload Asset Batches
      summary: Upload Asset Batches
      description: Upload assets batches to an organization.
      parameters:
      - description: The organization ID
        in: header
        name: X-EB-Organization-Id
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      - description: Source protocol type. Can be of API, SFTP or WEB
        in: query
        name: source
        required: true
        schema:
          type: string
          enum:
          - API
          - SFTP
          - WEB
          default: API
      - description: Upload action type. Can be one of UPDATE, REPLACE or DELETE
        in: query
        name: uploadType
        required: true
        schema:
          type: string
          enum:
          - UPDATE
          - REPLACE
          - DELETE
          default: UPDATE
      - description: Name of Asset Type
        in: query
        name: assetTypeName
        required: true
        schema:
          type: string
      - description: Available on manager portal (Settings --> Organization --> Contacts/Assets --> Assert Types)
        in: query
        name: assetTypeId
        required: false
        schema:
          type: string
          example: 665ff8e1a1b61d39e577b9c6
          default: 665ff8e1a1b61d39e577b9c6
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
