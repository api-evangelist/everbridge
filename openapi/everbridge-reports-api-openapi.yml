openapi: 3.2.0
info:
  title: Everbridge Reports API
  version: '1.0'
  description: 'Operations tagged Reports across 2 of this provider''s published API definitions: everbridge-eb-suite-openapi.json, everbridge-snapcomms-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.everbridge.net/rest
- url: https://api.everbridge.eu/rest
- description: API Url
  url: https://api.snapcomms.com/v1
- description: API Sandbox Url
  url: https://api.snapcomms.com/mock
tags:
- description: EB Suites - Reports Management
  name: Reports
paths:
  /notificationReports/{organizationId}/{notificationId}:
    get:
      deprecated: false
      description: Retrieve the report of a notification within an organization
      operationId: EBS Get Notification Report
      parameters:
      - description: Everbridge Organization id. Available on manager portal (Settings --> Organization --> Base Information)
        in: path
        name: organizationId
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      - description: The ID of the notification containing the notification reports
        in: path
        name: notificationId
        required: true
        schema:
          example: '609886966644738'
          type: integer
      - allowEmptyValue: false
        description: Filter notification by contact status
        in: query
        name: contactStatus
        required: false
        schema:
          enum:
          - CONFIRMED
          - CONFIRMEDLATE
          - NOTCONFIRMED
          - UNREACHABLE
          type: string
      - allowEmptyValue: false
        description: The page number of the notification reports to return.
        in: query
        name: pageNumber
        required: false
        schema:
          example: '1'
          type: integer
      - allowEmptyValue: false
        description: The page size of notification reports to return
        in: query
        name: pageSize
        required: false
        schema:
          default: '100'
          example: '100'
          type: integer
      - allowEmptyValue: false
        description: "If queryType is set to `pageQuery`, client needs to specify a page number in the request. \n Keep in mind when using “scroll” that the report has about a 5 minute delay. It is always preferred to use `pageQuery` if you want to get the report earlier."
        in: query
        name: queryType
        required: false
        schema:
          default: pageQuery
          enum:
          - pageQuery
          - scroll
          type: string
      - allowEmptyValue: false
        description: If queryType is set to scroll, then we will return a scrollId in each response.
        in: query
        name: scrollId
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Retrieve data modified since that date time, like '1526986170000'
        in: query
        name: sinceDate
        required: false
        schema:
          example: '1526986170000'
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Default
                  value:
                    firstPageUri: https://api-dev3.everbridge.net/rest/notificationReports/1536984111644674/609886966644738/?pageSize=100&queryType=pageQuery&pageNumber=1
                    lastPageUri: https://api-dev3.everbridge.net/rest/notificationReports/1536984111644674/609886966644738/?pageSize=100&queryType=pageQuery&pageNumber=1
                    message: OK
                    page:
                      currentPageNo: 1
                      data:
                      - attempt: 0
                        attemptTime: 1675782977471
                        callResultByPaths:
                        - attemptId: 63e26b40898a4046ffd1ac81
                          attemptOrder: 1
                          attemptTime: 1675782977471
                          callResult: Sent
                          confirmed: false
                          countryCode: US
                          cycleSeq: 1
                          firstName: Ajay
                          journalId: 0
                          lastName: Goel
                          path: Email
                          pathText: ajay.goel@everbridge.com
                          waitTime: 0
                        confirmed: false
                        contactId: 595799473913944
                        createdId: 1530249602924607
                        externalId: ajay.goel@everbridge.com
                        firstAttemptTime: 1675782977471
                        firstName: Ajay
                        fullName: Ajay Goel
                        id: 0
                        lastName: Goel
                        notificationId: 609886966644738
                        result: Sent
                      pageSize: 100
                      start: 0
                      totalCount: 1
                      totalPageCount: 1
              schema:
                properties:
                  message:
                    description: Request status
                    enum:
                    - OK
                    type: string
                type: object
          description: Accepted
        '400':
          content:
            application/json:
              examples:
                Invalid Request Input:
                  summary: Invalid Input
                  value:
                    message: type mismatch exception
                    status: 400
              schema:
                properties:
                  message:
                    description: Error message
                    type: string
                  status:
                    description: Missing or invalid request input
                    enum:
                    - '400'
                    type: string
                type: object
          description: Invalid request input
        '401':
          content:
            application/json:
              examples:
                Invalid Credentials:
                  summary: Invalid Credentials
                  value:
                    message: 'Invalid credentials: Password invalid'
                    status: 401
              schema:
                properties:
                  message:
                    description: Error message
                    type: string
                  status:
                    description: Invalid or missing credentials
                    enum:
                    - '401'
                    type: string
                type: object
          description: Invalid Credentials
        '500':
          content:
            application/json:
              examples:
                Internal error:
                  summary: Internal Error
                  value:
                    message: Internal Error
                    status: 500
              schema:
                properties:
                  message:
                    description: Error message
                    type: string
                  status:
                    description: Internal Error
                    enum:
                    - '500'
                    type: string
                type: object
          description: Internal Error
      security:
      - API_Authorizer: []
      - BasicAuth: []
      - api_key: []
      summary: Get Notification Report
      tags:
      - Reports
      x-amazon-apigateway-integration:
        httpMethod: GET
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.path.notificationId: method.request.path.notificationId
          integration.request.path.organizationId: method.request.path.organizationId
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        uri: https://ebs-restapi-prod-us.evbg.io/rest/notificationReports/{organizationId}/{notificationId}
    servers:
    - url: https://api.everbridge.net/rest
    - url: https://api.everbridge.eu/rest
  /notifications/{organizationId}/reports:
    get:
      description: Retrieve all mass notifications ids for an organization.
      operationId: EBS Mass Notification Report
      parameters:
      - description: The ID of the organization containing the notification reports
        in: path
        name: organizationId
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      - description: The range of notification start date begin time (Epoch time)
        in: query
        name: startTime
        required: false
        schema:
          default: -1
          format: int64
          type: integer
      - description: The range of notification start date end time (Epoch time)
        in: query
        name: endTime
        required: false
        schema:
          default: -1
          format: int64
          type: integer
      - description: The status of notification processing
        in: query
        name: notificationStatus
        required: false
        schema:
          enum:
          - Active
          - Inactive
          type: string
      - description: The page number of the notification reports to return.
        in: query
        name: pageNumber
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            examples:
              Default:
                summary: Default Template Values
                value:
                  incidentAction: Launch
                  incidentPhases:
                  - phaseTemplate:
                      templateId: 1536984111644674
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestfulCollectionResult'
          description: OK
        '400':
          description: Missing or invalid request input
        '401':
          description: Org is invalid
        '404':
          description: Not a valid resource
        '500':
          description: Internal Error
      security:
      - API_Authorizer: []
      - BasicAuth: []
      - api_key: []
      summary: Mass Notification Report
      tags:
      - Reports
      x-amazon-apigateway-integration:
        httpMethod: GET
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.path.organizationId: method.request.path.organizationId
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        uri: https://ebs-restapi-prod-us.evbg.io/rest/notifications/{organizationId}/reports
    servers:
    - url: https://api.everbridge.net/rest
    - url: https://api.everbridge.eu/rest
