        description: Defaults  to UTC (e.g. 2023-05-08T04:24:56.463Z)
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPublishingStatisticsResponse'
              example:
                content:
                - publishDate: '2023-05-08T04:24:56.4630000+00:00'
