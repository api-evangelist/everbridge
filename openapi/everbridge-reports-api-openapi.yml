  /reports/successreport/{assetid}:
    get:
      tags:
      - Reports
      summary: Report - Success Report
      description: ''
      operationId: report-success-report
      parameters:
      - name: assetid
        in: path
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        description: Defaults to UTC minus 2 years (e.g. 2023-05-08T04:24:56.463Z)
        schema:
          type: string
      - name: endDate
        in: query
        description: Defaults to UTC (e.g. 2023-05-08T04:24:56.463Z)
        schema:
          type: string
      - name: version
        in: query
        description: Defaults to -1 which is equivalent to "consolidated". -2 means all versions, any positive value limit the result to a specific content version
