    post:
      description: 'Create a new custom role based on a baseRoleTemplate or baseRole.<br/>Note: You must specify either baseRoleTemplate or baseRole, but not both or neither.<br/>You can refer to the provided [file-link](https://manager.everbridge.net/docs?docLocation=/fe-manager-portal-role/assets/APIFeatureName.pdf) whenever needed to identify the corresponding apiFeatureName for your API requests based on the UI feature name.'
