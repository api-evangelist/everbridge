      parameters:
      - description: To control if the response should include detailed role data.
        in: query
        name: verbose
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            examples:
              Create role based on another role.:
                summary: Create role based on another role.
                value:
                  baseRoleId: 2676144193143000
                  name: restAPI_CR_demo-2
                  organizationId: 1561998001176578
                  roleTemplate: CUSTOMIZED
              Create role based on roleTemplate:
                summary: Create role based on roleTemplate
                value:
                  baseRoleTemplate: DISPATCHER
                  name: restAPI_CR_demo-1
                  organizationId: 1561998001176578
                  roleTemplate: CUSTOMIZED
            schema:
              properties:
                baseRoleId:
                  description: An existing custom role within the organization that can be used as a starting point for defining your custom role.
                  type: string
                baseRoleTemplate:
                  description: A predefined system role that serves as a starting point for defining your custom role. Either baseRoleTemplate or baseRoleId is required for creating/updating a Custom Role.
                  enum:
                  - DATA_MANAGER
                  - DISPATCHER
                  - GROUP_MANAGER
                  - INCIDENT_ADMIN
                  - INCIDENT_OPERATOR
                  type: string
                name:
                  type: string
                organizationId:
                  type: integer
