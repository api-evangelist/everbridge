- url: https://api.everbridge.eu/rest
tags:
- description: EB Suites - Notification Category Management
  name: Notification Categories
paths:
  /notificationCategories/{organizationId}:
    get:
      operationId: EBS List Notification Categories
      parameters:
      - description: The ID of the organization containing the notificationCategories
        in: path
        name: organizationId
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      - description: The page number of notificationCategories to return.
        in: query
        name: pageNumber
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  summary: success
                  value:
                    firstPageUri: https://api-dev3.everbridge.net/rest/notificationCategories/1536984111644674?pageNumber=1
                    lastPageUri: https://api-dev3.everbridge.net/rest/notificationCategories/1536984111644674?pageNumber=1
                    message: OK
                    page:
                      currentPageNo: 1
                      data:
                      - accountId: 1536846672691202
                        createdDate: 1675437422375
                        createdId: 585800790048776
                        createdName: Ajay Goel
                        id: 594253285687298
                        lastModifiedDate: 1675437422375
