            type: string
          enum:
          - PUBLIC
          - NETWORK_GROUP
        affectedAreas:
          type: string
          description: The shape content.
        groupIds:
          type: array
          description: The  groupIds defined in network setting page.
          items:
            type: string
    CemResultsStaticLocationType:
