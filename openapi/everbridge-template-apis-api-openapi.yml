          - DESCENDING
      required:
      - ids
    GroupRecipientName:
      type: object
      description: Refers to a group of contact recipients by a name as shown in the [Everbridge Groups API](https://developers.everbridge.net/internal/reference/ebs-list-groups).
      required:
      - type
      - name
      properties:
        type:
          type: string
          description: Must be set to exactly `Name`.
          enum:
          - Name
        name:
          type: string
          description: The name of the contact group.
    CemResultsPropertyQuery:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: The IDs of the properties to query by.
    LaunchRecipients:
      type: object
      description: 'Describes the recipients of notifications from the communication. At least one recipient must be provided when `Mode` is `LIVE` or `SIMULATION`.


        **Note:** When specifying `recipients` in conjunction with a `templateId` in a request, the recipients specified here in the request will _replace_ any recipients defined in the template. Omitting `recipients` in the request will result in Communications using the recipients from the specified template. If the desired functionality is a merged set of recipients between the template and the request, the recipients from the template must be combined into a single `recipients` object in the request.'
      properties:
        contacts:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/ContactRecipientExternalId'
            - $ref: '#/components/schemas/ContactRecipientId'
            - $ref: '#/components/schemas/ContactRecipientName'
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
          description: A set of contact to send notifications to regardless of any other criteria.
        publicUsers:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/SemanticQuery'
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
          description: A set of `publicuser` queries that contain a set of `publicuser` to send notifications to.
        excluded:
          type: object
          description: Specifies recipients to exclude from notifications.
          properties:
            contacts:
              type: array
              items:
                anyOf:
                - $ref: '#/components/schemas/ContactRecipientExternalId'
                - $ref: '#/components/schemas/ContactRecipientId'
                - $ref: '#/components/schemas/ContactRecipientName'
                - $ref: '#/components/schemas/ResultSetQueryRecipients'
              description: A set of contacts to exclude from notifications.
        groups:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/GroupRecipientId'
            - $ref: '#/components/schemas/GroupRecipientName'
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
          description: A set of contact groups to send notifications to regardless of any other criteria.
        query:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
            - $ref: '#/components/schemas/SemanticQuery'
          description: A set of contact queries that contain a set of contacts to send notifications to.
        rules:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/RuleRecipientId'
            - $ref: '#/components/schemas/RuleRecipientName'
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
          description: A set of contact rules (filters) to use when determining a set of contacts to send notifications to.
        alert:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/ResultSetQueryRecipients'
          description: A set of affected contacts from a CEM Alert.
    Twitter:
