          type: string
        mimeType:
          type: string
        downloadUrl:
          type: string
        size:
          type: integer
          format: int64
    AudioMessageBody:
      allOf:
      - $ref: '#/components/schemas/LaunchMessageBody'
      - type: object
        required:
        - type
        - attachmentId
        - paths
        properties:
          attachmentId:
            type: string
            description: The system-generated attachment ID referring to the audio file for this message.
          type:
            type: string
            description: A generic classifier of the message body, further refined by `contentType`. Must be set to exactly `Audio`.
            enum:
            - Audio
          paths:
            type: array
            description: A set of contact delivery path types that this message body should be sent to.
            items:
              $ref: '#/components/schemas/AudioOnlyPathCategory'
    Command:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of command to execute
    RuleRecipientId:
      type: object
      description: Refers to a group of contact rules (filters) by an ID. Retrieve contact rule IDs using the [Everbridge Contact Filters API](https://developers.everbridge.net/internal/reference/ebs-v1-contact-filters)
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: Must be set to exactly `Id`.
          enum:
          - Id
        id:
          type: string
          description: The contact rule (filter) ID.
    SenderSettings:
      type: object
      description: Specify what recipients will see as the "sender" of the notifications sent from the communication (e.g. caller ID upon receiving a phone call.)
      properties:
        email:
          type: object
          description: Configuration elements that control the display of the sender in email notifications.
          properties:
            name:
              type: string
              description: The display name used in email notifications.
            replyToEmail:
              type: string
              description: The "reply to" email address to use for email notifications.
        voice:
          type: array
          description: Configuration elements that control the display of the caller in phone call notifications.
          items:
            $ref: '#/components/schemas/VoiceSettings'
        sms:
          type: array
          description: Configuration elements that control the display of the sender in SMS notifications.
          items:
            $ref: '#/components/schemas/SmsSettings'
    SmsSettings:
      type: object
      description: The SMS short code or phone number shown to recipients of text messages.
      required:
      - countryCode
      - smsId
      properties:
        countryCode:
          type: string
          description: The ISO 3166 two-letter code for the country where this phone number is valid. Please refer to [the Wikipedia page on ISO 3166 country codes](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) for valid values.
        smsId:
          type: string
          description: The SMS ID to use when sending SMS messages to recipients residing in the country specified by `countryCode`.
          pattern: '^[a-zA-Z0-9]+(?: [a-zA-Z0-9]+)?$'
          minLength: 1
          maxLength: 11
    ApiPaginatedResponse:
      type: object
      description: A page of data from an endpoint.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TemplateBase'
        pages:
          type: object
          properties:
            currentPage:
              type: number
              description: The requested page number.
            pageSize:
              type: number
              description: The requested page size.
            pageCount:
              type: number
              description: The number of elements in the current page.
            totalPages:
              type: number
              description: The total number of pages available for request.
            maxSize:
              type: number
              description: The maximum size of a single page that is allowed by the API.
            totalCount:
              type: number
              description: The total number of elements across all pages.
    DeliverySettings:
      type: object
      description: Settings that adjust the way that notifications are delivered to recipients.
      properties:
        paths:
          type: array
          description: A list of contact delivery paths to use in notifying recipients. Refer to the [Everbridge List Contact Paths API](https://developers.everbridge.net/internal/reference/ebs-list-contact-paths) to find contact delivery paths for an organization.
          items:
            $ref: '#/components/schemas/ApiDeliveryPath'
        pathOrder:
          type: string
          description: Determines which ordering of delivery paths are used for this notification.
          enum:
          - CONTACT
          - ORGANIZATION
          - CUSTOM
        ttl:
          type: string
          description: "The amount of time, beginning at the communication's launch, to continue sending notifications (\"time-to-live\"). This is in formatted in the ISO 8601 \"duration\" format and must be specified as a number of whole hours.\n Supports a minimum value of one minute up to a maximum value of five days."
          example: PT5H
        deliveryRetries:
          type: integer
          description: The number of attempts to contact recipients that haven't responded.
          maximum: 20
        pathInterval:
          type: string
          description: How long the system should wait before attempting to contact the next device in a recipient's delivery paths. This is in formatted in the ISO 8601 "duration" format.
          enum:
          - PT0M
          - PT1M
          - PT2M
          - PT3M
          - PT5M
          - PT10M
          - PT15M
        deliveryInterval:
          type: string
          description: "How long the system should wait before attempting another delivery starting from the beginning of a recipient's delivery paths.\n Supported values are 0 minutes, 1 minute, 2 minutes, or multiples of 5 minutes up to 60 minutes."
          example: PT15M
        applyThrottle:
          type: boolean
          description: If set to true, will throttle the number of phone calls made.
        quietTimeOverride:
          type: boolean
          description: If set to true, then notifications from this communication will ignore recipients' quiet time settings (i.e. phone calls will be made despite the recipient opting to only receive them during a certain time range.)
    ResultSetQueryRecipients:
      type: object
      description: An ID of an existing CEM Results result set where the contacts cached within the result set are included as recipients in the communication.
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: Must be set to exactly `ResultSet`.
          enum:
          - ResultSet
        id:
          type: string
          description: A valid result set ID. Must represent a set of entities that can be contacted (e.g. contacts, not assets).
          example: evbg+result:contact:cemp-1234567890abcdef01234567-abcdef01-2345-6789-abcd-ef0123456789:1697471720114
    RecipientSettings:
      type: object
      description: Settings that adjust how recipients respond to the communication.
      properties:
        confirm:
          type: boolean
          description: Request that recipients confirm that the notification was received.
        smsCallback:
          type: boolean
          description: Request that SMS recipients call to confirm delivery.
        voiceMailOption:
          type: string
          description: "Control how the system responds if it is sent to a recipient's voicemail inbox:\n * `MESSAGEONLY`: Leave a message but do not consider the notification confirmed.\n * `MESSAGEWITHCONFIRMATION`: Leave a message and consider the notification confirmed.\n * `NOMESSAGE`: Do not leave a message; the notification is not confirmed."
          enum:
          - MESSAGEONLY
          - MESSAGEWITHCONFIRMATION
          - NOMESSAGE
        mobileSettings:
          type: object
          properties:
            requestImage:
              type: boolean
              description: Request an image of recipients and their surroundings.
            requestLocation:
              type: boolean
              description: Request that recipients share their location.
            allowShare:
              type: boolean
              description: Allow recipients to share the message with others.
            requireConfirm:
              type: boolean
              description: Require that recipients confirm receipt.
            requestComment:
              type: boolean
              description: Request that recipients reply to the notification with a brief description of their status.
    CemResultsBooleanPropertyQuery:
      allOf:
      - $ref: '#/components/schemas/CemResultsPropertyQuery'
