      required:
      - body
      - includeSelectedMapShape
      properties:
        body:
          type: string
          description: The core content that displayed on public member public message  page.
        includeSelectedMapShape:
          type: boolean
          description: 'Whether include the map defined in recipient part  '
    ContentAttachment:
      type: object
