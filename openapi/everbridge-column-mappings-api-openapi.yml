      tags:
      - Column Mappings
      operationId: EB AM Get Column Mapping
      summary: Get Column Mapping
      description: Get Column Mapping
      parameters:
      - name: X-EB-Organization-Id
        in: header
        description: Organization Id
        required: true
        schema:
