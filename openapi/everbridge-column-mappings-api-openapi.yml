  version: 1.0.0
servers:
- url: https://api.everbridge.net/rest/v2/asset-management
tags:
- name: Column Mappings
  description: Column mapping management operations
paths:
  /column-mappings:
    get:
      tags:
      - Column Mappings
      operationId: EB AM List Column Mappings
      summary: List Column Mappings
      description: List Column Mappings
      parameters:
      - name: X-EB-Organization-Id
        in: header
        description: Organization Id
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: success
                  value:
                  - id: 691af5264cca16096703bf88
                    organizationId: 1536984111644674
                    createdId: 1
                    createdName: EBSuiteRestApiAdmin-Gateway
                    lastModifiedId: 1
                    lastModifiedName: EBSuiteRestApiAdmin-Gateway
                    createdTimestamp: 1763374374760
                    lastModifiedTimestamp: 1763374374760
                    from: Name
                    to: id
                    seq: 0
      security:
      - API_Authorizer: []
      - BasicAuth: []
      - api_key: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: https://ebs-restapi-prod-us.evbg.io/rest/v2/asset-management/column-mappings
        responses:
          default:
            statusCode: '200'
        requestParameters:
          integration.request.header.Authorization: context.authorizer.override_token
        passthroughBehavior: when_no_match
    post:
      tags:
      - Column Mappings
      operationId: EB AM Create Column Mapping
      summary: Create Column Mapping
      description: Create Column Mapping
      parameters:
      - name: X-EB-Organization-Id
        in: header
        description: Organization Id
        required: true
        schema:
          $ref: '#/components/schemas/organizationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnMappingRequest'
            examples:
              basic:
                summary: basic
                value:
                  from: Name
                  to: id
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMapping'
              examples:
                success:
                  summary: success
                  value:
                    id: 691af5264cca16096703bf88
                    organizationId: 1536984111644674
                    createdId: 1
                    createdName: EBSuiteRestApiAdmin-Gateway
                    lastModifiedId: 1
                    lastModifiedName: EBSuiteRestApiAdmin-Gateway
                    createdTimestamp: 1763374374760
                    lastModifiedTimestamp: 1763374374760
                    from: Name
                    to: id
                    seq: 0
      security:
      - API_Authorizer: []
      - BasicAuth: []
      - api_key: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: https://ebs-restapi-prod-us.evbg.io/rest/v2/asset-management/column-mappings
