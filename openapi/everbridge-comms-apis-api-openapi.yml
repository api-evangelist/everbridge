          minLength: 1
          maxLength: 11
    CommDetail:
      type: object
      properties:
        commId:
          description: The ID of the communication.
          example: a5a71f87-4f3b-472f-a39d-47cc1c3c9b30
          type: string
        title:
          description: The title and possible subject of the communication.
          example: Test Communication
          type: string
        description:
          type: string
          description: A description of the communication. This is not shown to recipients.
          example: This is a test communication.
        mode:
          description: Describes the behavior of the communication.
          example: Live
          type: string
          enum:
          - Live
          - Simulation
          - Preview
        status:
          description: The current status of the communication.
          example: READY
          type: string
          enum:
          - CANCELLED
          - FAILED
          - PROCESSING
          - READY
          - SCHEDULED
          - SENT
        organizationId:
          description: The Everbridge organization ID that owns the communication.
          example: '135975236674'
          type: string
        created:
          description: The date and time the communication was created.
          example: 2024-02-06T20:00:00+0000
          type: string
          format: date-time
        updated:
          description: The date and time the communication was last updated.
          example: 2024-02-06T20:00:00+0000
          type: string
          format: date-time
        notifications:
          description: A list of notifications associated with the communication.
          type: array
          items:
            type: object
            properties:
              notificationId:
                description: The ID of the notification.
                example: notification://a5a71f87-4f3b-472f-a39d-47cc1c3c9b30
                type: string
              status:
                description: The current status of the notification.
                example: READY
                type: string
                enum:
                - CANCELLED
                - FAILED
                - PROCESSING
                - READY
                - SENT
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: A list of tags assigned to the communication.
        userId:
          description: The ID of the user that launched the communication.
          example: '136578946518096'
          type: string
        contents:
          description: A list of contents associated with the communication.
          type: array
          items:
            $ref: '#/components/schemas/RenderedContent'
        priority:
          description: Priority of the communication
          example: NORMAL
          type: string
          enum:
          - NORMAL
          - HIGHPRIORITY
          - LIFETHREATENING
        name:
          description: Name of the communication.
          example: Test Communication
          type: string
        eventType:
          description: Type of event
          example: TODO
          type: string
        launchedBy:
          type: string
          description: The full name of the user who launched this communication
        publicSafety:
          type: boolean
          description: Communication is being sent as a Public Safety message
        launchedFrom:
          type: string
          description: The source of the communication launch. This is used for tracking purposes and does not affect the behavior of the communication. Public should use API.
          enum:
          - API
          - UI
          - ORCHESTRATION
          - CRITICALEVENT
          - SAFETYMESSAGE
          - COMMSSCHEDULE
          - RESPONSEMGMT
        roleItem:
          $ref: '#/components/schemas/RoleItem'
        sent:
          description: Time the communication was sent.
          example: Test Communication
          type: string
          format: date-time
        active:
          description: Communication is active or not
          example: 'true'
          type: boolean
        contentMetadata:
          $ref: '#/components/schemas/CommContentMetadata'
        templateId:
          description: The identifier of the template used for the communication.
          example: 2024-02-06T20:00:00+0000
          type: string
          format: d122a3f7-882f-4b44-a20b-124d07c58f5b
        closedBy:
          description: The full name of the user from the latest CLOSE activity, present only when the communication is inactive and the user can be resolved.
          type: string
        closedAt:
          description: The date and time the communication was closed, present only when the communication is inactive.
          example: 2024-02-06T20:00:00+0000
          type: string
          format: date-time
        activatedBy:
          description: The full name of the user from the latest REOPEN activity, present only when the communication is active and the user can be resolved.
          type: string
        activatedAt:
          description: The date and time from the latest REOPEN activity, present only when the communication is active.
          example: 2024-02-06T20:00:00+0000
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PublicCommError'
          description: A list of errors associated with the communication.
        planId:
          type: string
          description: The ID of the plan that launched the with communication, if any.
    ResultSetQueryRecipients:
      type: object
      description: An ID of an existing CEM Results result set where the contacts cached within the result set are included as recipients in the communication.
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: Must be set to exactly `ResultSet`.
          enum:
          - ResultSet
        id:
          type: string
          description: A valid result set ID. Must represent a set of entities that can be contacted (e.g. contacts, not assets).
          example: evbg+result:contact:cemp-1234567890abcdef01234567-abcdef01-2345-6789-abcd-ef0123456789:1697471720114
    RecipientSettings:
      type: object
      description: Settings that adjust how recipients respond to the communication.
      properties:
        confirm:
          type: boolean
          description: Request that recipients confirm that the notification was received.
        smsCallback:
          type: boolean
          description: Request that SMS recipients call to confirm delivery.
        voiceMailOption:
          type: string
          description: "Control how the system responds if it is sent to a recipient's voicemail inbox:\n * `MESSAGEONLY`: Leave a message but do not consider the notification confirmed.\n * `MESSAGEWITHCONFIRMATION`: Leave a message and consider the notification confirmed.\n * `NOMESSAGE`: Do not leave a message; the notification is not confirmed."
          enum:
          - MESSAGEONLY
          - MESSAGEWITHCONFIRMATION
          - NOMESSAGE
        mobileSettings:
          type: object
          properties:
            requestImage:
              type: boolean
              description: Request an image of recipients and their surroundings.
            requestLocation:
              type: boolean
              description: Request that recipients share their location.
            allowShare:
              type: boolean
              description: Allow recipients to share the message with others.
            requireConfirm:
              type: boolean
              description: Require that recipients confirm receipt.
            requestComment:
              type: boolean
              description: Request that recipients reply to the notification with a brief description of their status.
    CemResultsBooleanPropertyQuery:
      allOf:
      - $ref: '#/components/schemas/CemResultsPropertyQuery'
      - type: object
        required:
        - type
        description: Provides querying against boolean properties in Contacts and Assets.
        properties:
          type:
            type: string
            description: Must be set to exactly `Boolean`.
            enum:
            - Boolean
          value:
            type: boolean
            description: A boolean value to match against the properties.
    GroupRecipientName:
      type: object
      description: Refers to a group of contact recipients by a name as shown in the [Everbridge Groups API](https://developers.everbridge.net/internal/reference/ebs-list-groups).
      required:
      - type
      - name
      properties:
        type:
          type: string
          description: Must be set to exactly `Name`.
          enum:
          - Name
        name:
          type: string
          description: The name of the contact group.
    CemResultsPropertyQuery:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: The IDs of the properties to query by.
    CemResultsStringPropertyQuery:
