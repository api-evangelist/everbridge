    LaunchCommRequest:
      description: Request body for launching a communication. Only valid when `mode` is `LIVE` or `SIMULATION`.
      allOf:
      - $ref: '#/components/schemas/BaseLaunchCommRequest'
      - type: object
        required:
        - title
        - mode
        properties:
          mode:
            $ref: '#/components/schemas/LaunchMode'
          title:
            type: string
            description: The title or summary of the communication, shown in the Communications interface. This is not the title used in the notification.
          description:
            type: string
            description: A description of the communication. This is not shown to recipients.
            maxLength: 500
          publicSafety:
            type: boolean
            description: Communication is being sent as a Public Safety message
          priority:
            type: string
            description: "The level of urgency for this communication.\n * `NORMAL`: The baseline level of urgency.\n * `HIGHPRIORITY`: Action is recommended.\n * `LIFETHREATENING`: Immediate action is required due to the risk of loss of life or bodily harm."
            enum:
            - NORMAL
            - HIGHPRIORITY
            - LIFETHREATENING
          eventType:
            type: string
            description: A category for the communication.
          launchedFrom:
            type: string
            description: The source of the communication launch. This is used for tracking purposes and does not affect the behavior of the communication. Public should use API.
            enum:
            - API
            - UI
            - ORCHESTRATION
            - CRITICALEVENT
            - SAFETYMESSAGE
            - COMMSSCHEDULE
            - RESPONSEMGMT
          recipients:
            $ref: '#/components/schemas/LaunchRecipients'
          publicMessages:
            type: array
            description: The bodies of the public message. Each type at most has one body.
            items:
              anyOf:
              - $ref: '#/components/schemas/WebWidgetPublicMessage'
              - $ref: '#/components/schemas/AlertUsPublicMessage'
              - $ref: '#/components/schemas/GenericOneWayPublicMessage'
              - $ref: '#/components/schemas/AudioBulletinBoardPublicMessage'
              - $ref: '#/components/schemas/SocialMediaPublicMessage'
              - $ref: '#/components/schemas/MemberPortalPublicMessage'
              - $ref: '#/components/schemas/EverbridgeCommunityPublicMessage'
              - $ref: '#/components/schemas/NetworkPublicMessage'
              - $ref: '#/components/schemas/CAPPublicMessage'
          activity:
            $ref: '#/components/schemas/activity'
          planId:
            type: string
            description: Unique identifier of the plan responsible for launching the communication.
    BaseLaunchCommRequest:
      type: object
      properties:
        templateId:
          type: string
          description: 'An ID of a template to use for this communication. Supported template types:

            - Communication Template: IDs of the form `commsTemplate://{id}`

            - Notification Template (legacy): IDs of the form `legacyMN://{id}`

            - Incident Template (legacy): IDs of the form `legacyIC://{id}/{phaseName}`

            For legacy templates, you can retrieve template details via the `/templates/convert` API.'
          example: commsTemplate://bdbc6a41-ce36-4c14-9add-36306a46c95f
        context:
          type: object
          description: Various contextual properties to be used with `templateId`.
          properties:
            variables:
              type: array
              description: Variables to use within templates specified by `templateId`.
              items:
                type: object
                description: An individual variable ID and its value. The `value` property may take on multiple forms depending on the type of the variable specified in the [Variable Library](https://developers.everbridge.net/internal/reference/get_v1).
                properties:
                  variableId:
                    type: string
                    description: The ID of the variable, as described by the Variable Library.
                  value:
                    oneOf:
                    - type: string
                      description: "A single string value for a variable. This would include single selection variables, textbox variables, textarea variables, and date variables. \n\n*Note:* It is recommended to send the value for date variables as an ISO 8601 date and time string (`2024-11-19T14:01:31Z`). The Communications API will automatically format the value based on the specified formatting of the variable in the Variable Library."
                    - type: array
                      description: Specifies multiple values for a variable. This is intended to be used with the multiple selection variable only.
                      items:
                        type: string
            contextIds:
              type: array
              description: IDs of contextual objects to use in the template. Each ID takes the form of `shortName://sourceID` where `shortName` is the property of the same name from the Context APIs and the `sourceID` is the identifier from the context source. Please see the documentation on the Context APIs for more information.
              maxItems: 1
              items:
                type: string
        exercise:
          type: boolean
          description: Is enable exercise mode
        settings:
          $ref: '#/components/schemas/ApiSettings'
        message:
          $ref: '#/components/schemas/MessageContent'
    LaunchMode:
      type: string
      enum:
      - LIVE
      - SIMULATION
      description: "Adjust the behavior of the communication:\n * `LIVE`: Launch the communication and send notifications to all recipients. At least one recipient must be specified in `recipients`.\n * `SIMULATION`: Launch the communication but do not send notifications; useful for determining the impact of a communication before sending it with `Live`. At least one recipient must be specified in `recipients`."
