    ContextData:
      type: object
      properties:
        contextIds:
          type: array
          items:
            type: string
          description: The context IDs of any context objects used for the communication.
        values:
          type: array
          description: Values, including variables, identified within the communication.
          items:
            type: object
            description: An individual value.
            properties:
              variableId:
                type: string
                description: The ID of a variable that was used to render the value. Values extracted from context objects (e.g. alerts) may not have an ID.
              label:
                type: string
                description: A human-friendly name for this value.
              value:
                type: string
                description: The rendered value, if any.
              rawValue:
                description: An unformatted value. This is intended for resubmitted a variable value from a previous communication in an update to an existing communication or in a new communication that uses the same variable. Not supported by values extracted from context objects (e.g. alerts).
                oneOf:
                - type: string
                  description: A single string value for a variable. This includes single selection variables, textbox variables, textarea variables, and date variables.
                - type: array
                  description: Specifies multiple values for a variable. This is intended to be used with the multiple selection variable only.
                  items:
                    type: string
              type:
                type: string
                description: "Describes where the value was sourced from:\n\n * `Variable`: The value was sourced from a custom variable.\n * `Context`: The value was sourced from a context object such as an alert."
                enum:
                - Context
                - Variable
