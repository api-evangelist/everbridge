      required:
      - tokenIds
      - incLink
      properties:
        body:
          type: string
          description: The title of social media.
        tokenIds:
          type: array
          description: The tokens of social media ,it can contain the token of  both twitter and facebook.
          items:
            type: string
        incLink:
          type: boolean
          description: Whether the message publish to social media contains a link
        imageId:
          type: string
          description: The system-generated image ID referring to the image file for this message..
        customContents:
          type: array
          description: The bodies of the custom social media  Each type at most has one item.
          items:
            anyOf:
            - $ref: '#/components/schemas/Facebook'
            - $ref: '#/components/schemas/Twitter'
    MessageBody:
      type: object
      description: This is the base object that AudioBody, TextualBody, and WebpageBody is build upon.
      properties:
        title:
          type: string
          description: The title of the notification; may be included in the notification.
        language:
          $ref: '#/components/schemas/SupportedLanguages'
        contentType:
          type: string
          example: text/plain
          description: The MIME type of describing the format of the message body.
        paths:
          type: array
          description: PathCategory instances describing which delivery paths should receive this message body.
          items:
            $ref: '#/components/schemas/PathCategory'
        attachments:
