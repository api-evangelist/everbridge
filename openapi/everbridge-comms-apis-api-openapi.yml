      - paths
      - cap
      properties:
        body:
          type: string
          description: The CAP message body for the targeted modalities.
        paths:
          type: array
          description: The CAP delivery modalities this body applies to. A modality may be targeted by at most one CAP public message.
          items:
            type: string
            enum:
