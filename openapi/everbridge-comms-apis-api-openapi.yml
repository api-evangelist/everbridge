components:
  schemas:
    ContentMetadata:
      type: object
      properties:
        contentType:
          type: string
          description: An [RFC 5646](https://datatracker.ietf.org/doc/html/rfc5646) standard language code describes what language the `content` is authored in. Please refer to [the Wikipedia page on IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag#List_of_common_primary_language_subtags) for a list of common subtags.
          example: text/plain
        language:
          $ref: '#/components/schemas/SupportedLanguages'
          description: The language of the content, as defined by the IETF's RFC 5646.
          example: en-US
        category:
          type: string
          description: A value used to categorize the content.
          example: text
        pathTypes:
          type: array
          items:
            type: string
            example: sms
          description: The deliveryPaths to which the content was targeted.
        contentLink:
          type: string
          format: uri
          description: The link to the content.
          example: https://api.everbridge.net/managerapps/communications/v1/a5a71f87-4f3b-472f-a39d-47cc1c3c9b30/contents/text/en-US
    AudioBulletinBoardPublicMessage:
      type: object
      description: The ABB public message content.
      required:
      - title
      - body
      - settingId
      properties:
        title:
          type: string
          description: The title of abb.
        body:
          type: string
          description: The core content of abb.
        settingId:
          type: string
          description: The setting id of abb that defined in setting page.
        audioKey:
          type: string
          description: 'The system-generated audio Key referring to the audio file for this message. '
        expires:
          type: string
          description: How long the message expires. This is in formatted in the ISO 8601 "duration" format.
          example: PT5H
    ActivityEntry:
      type: object
      properties:
        actor:
          description: The ID of the communication for this activity.
          type: string
          example: 3617cd9d-1815-4e35-9bfe-2a8def879956
        target:
          description: The ID of the target communication for this activity.
          type: string
          example: ebd15980-4183-4fb7-a037-bc4f1e42b990
        root:
          description: The ID of the thread root communication.
          type: string
          example: 380778f9-5cde-404f-8d28-c1b1526c9f57
        createdBy:
          $ref: '#/components/schemas/UserReference'
        createdAt:
          description: ISO 8601-compliant value for when the communication is created
          type: string
          example: '2024-10-17T01:51:39.721617Z'
        actionType:
          description: The activity log action type.
          type: string
          enum:
          - INIT
          - FOLLOWUP
          - UPDATE
          - RESEND
          - CLOSE
          - REOPEN
        messageType:
          description: 'The activity log message type '
          type: string
          enum:
          - STANDARD
          - POLL
          - CONFERENCE
    CommRecipientLogPerPath:
      type: object
      properties:
        pathCategory:
          type: string
          description: The path category of the recipient Log.
        awareId:
          type: string
          description: The PathId of the recipient Log.
        pathName:
          type: string
          description: The PathName of the recipient Log.
        pathValue:
          type: string
          description: The value of the current path. The value can be a email address or a phone number.
        status:
          type: string
          description: The status of the current path
          enum:
          - Duplicate
          - Unreachable
          - Attempted
          - ConfirmedLate
          - Confirmed
        attemptTime:
          description: Time the current path attempt to delivery.
          type: string
          format: date-time
        callResult:
          type: string
          description: The call result of the recipient Log.
          enum:
          - Voice Confirmed
          - Fax Not Confirmed
          - Recipient cannot be reached
          - Sent
          - Sent - Standard SMS
          - Sent (via RCS)
          - Sent - Attachments not Included
          - Delivered
          - Delivered - To Voicemail
          - Not Delivered - Voicemail Setting is Off
          - Not Delivered - Incorrect Security Code
          - Not Delivered - Duplicate Contact
          - Not Delivered - Duplicate Path
          - Not Delivered - Contact Path Not Defined
          - Not Delivered - Notification Expired
          - Confirmed
          - Confirmed (via RCS)
          - Confirmed by Operator
          - Confirmed by Call Back
          - Confirmed - On Conference Call
          - Confirmed - Conference Call Ended
          - Confirmed - Declined to Join Conference Call
          - Not Delivered - Voicemail Hung Up
          - Not Delivered - Recipient Hung Up
          - Not Delivered - No Answer
          - Not Delivered - Invalid Number
          - Not Delivered - Line Busy
          - Not Delivered - Communication Error
          - Not Delivered - Everbridge System Error
          - Not Delivered - Blocked Phone Number
          - 'Not Delivered - Device Not Detected '
          - Not Delivered - Out of Service
          - Not Delivered - Voicemail Detected
          - Not Delivered - No Fax Machine
          - Not Delivered - Server Error
          - Not Delivered - Recipient Mailbox is Full
          - Not Delivered - Invalid Email Address
          - Not Delivered - No Associated Device
          - Not Delivered - Unregistered Device
          - Not Delivered - No Push Service
          - Not Delivered - Carrier Rejected
          - Not Attempted - Unsubscribed
          - Not Attempted - Bounced Email
          - Not Attempted - Inactive Path
          - Not Attempted - Invalid Path
          - Not Attempted - Email Preferred over SMS
          - Not Attempted - Throttling Time Exceeded
          - Not Delivered - Downstream Communication Error
          - Not Delivered - Carrier Expired
          - Delivered - To Carrier
          - Delivered - To Handset
          - Delivered - To Handset (via RCS)
          - Not Delivered - Bounced Email
          - Not Delivered - Rendering Failure
          - Not Delivered - Reject
          - Not Delivered - Other Reason
          - Not Delivered - Device not enable RCS
          - Not Delivered - Invalid Path
          - Read
    Facebook:
      type: object
      description: The Facebook custom message content.
      properties:
        body:
          type: string
          description: The core content sent to facebook.
        imageId:
          type: string
          description: The system-generated image ID referring to the image file that will be sent to facebook
        image:
          $ref: '#/components/schemas/ContentAttachment'
    LaunchMessageBody:
      type: object
      required:
      - contentType
      - title
      properties:
        contentType:
          type: string
          description: "A MIME type, defined in IETF's [RFC 6838](https://datatracker.ietf.org/doc/html/rfc6838), that describes the content type (e.g. `text/plain` for plain text or `audio/ogg` for an audio file). The content types that are valid for a given message body depends on the `type` of the message body:\n * `AudioMessageBody`: Supports only `audio` MIME types with any of its supported contact delivery path types.\n * `TextualMessageBody`: Supports only `text` MIME types with any of its supported contact delivery path types; for audio-only contact delivery path types, the text content will be translated to spoken audio via text-to-speech.\n * `WebPageMessageBody`: Supports only `text` MIME types with any of its supported contact delivery path types."
        title:
          type: string
          description: A title for the notification. For audio messages, this is used for display purposes within the Everbridge portal.
          minLength: 1
          maxLength: 255
    PathCategory:
      type: string
      enum:
      - CATEGORY:BUSINESSMESSAGINGAPPS
      - CATEGORY:COMMON
      - CATEGORY:EMAIL
      - CATEGORY:MOBILEAPP
      - CATEGORY:PLAINTEXT
      - CATEGORY:SMS
      - CATEGORY:VOICE
    recipientStatisticSummary:
      description: Recipient statistics summary associated with the communication. - STILL IN DEVELOPMENT
      type: object
      properties:
        total:
          description: Total count of selected recipients
          type: integer
          example: '16'
        individual:
          description: Count of recipient selected from individual
          type: integer
          example: '8'
        groups:
          description: Count of recipients selected from groups
          type: integer
          example: '3'
        rules:
          description: Count of recipient selected from rules
          type: integer
          example: '4'
        maps:
          description: Count of recipient selected from maps
          type: integer
          example: '1'
        excluded:
          description: Count of recipient selected out
          type: integer
          example: '0'
        subscriptions:
          description: Count of recipient selected from subscriptions or public users
          type: integer
          example: '0'
        alert:
          description: Count of recipient selected from alerts
          type: integer
          example: '0'
    PublishOptionPathResponse:
      type: object
      description: The publish option path detail info you requested.
      properties:
        path:
          type: string
          description: the publish option path you are fetching.
        name:
          type: string
          description: The name of the web widget publish option path.
        status:
          type: string
          description: The status of web widget publish option path message.
          enum:
          - Active
          - Expired
          - Failed
          - Deactivated
          - InProgress
        durationType:
          type: string
          description: duration type
          enum:
          - SameAsBroadcastDuration
          - SetByCalendar
          - Custom
        expirationDate:
          type: string
          description: The date when the web widget message will expired
        deactivatedBy:
          type: string
          description: The user who deactivate the web widget message
          example: Ranen Liu
        deactivatedDate:
          type: string
          description: The date when the web widget message was deactivated
        expireDateTime:
          type: string
          description: The date time when abb message expired
        futureExpireDateTime:
          type: string
          description: The date time when abb message will expire
        twitter:
          type: array
          description: The title of social media.
          items:
            type: object
            properties:
              twitterName:
                description: The twitter account configured to receive publish message in social media
                type: string
              status:
                description: The status of message was sent to twitter
                example: Failed
                type: string
              errorMessage:
                description: The error of twitter message failed
                type: string
              errorCode:
                description: The error code of twitter message failed
                type: integer
        facebook:
          type: array
          description: The facebook account configured to receive publish message in social media
          items:
            type: string
    StopCommsResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The ID of the communication that was stopped.
    CommRecipientSource:
      type: object
      properties:
        type:
          type: string
          description: The way that recipient is selected from.
          enum:
          - Individual
          - Group
          - ContactFilter
          - Area
        names:
          type: string
          description: The specific names of the type,group name or contact filter names.
    DeliverySettings:
      type: object
      description: Settings that adjust the way that notifications are delivered to recipients.
      properties:
        paths:
          type: array
          description: A list of contact delivery paths to use in notifying recipients. Refer to the [Everbridge List Contact Paths API](https://developers.everbridge.net/internal/reference/ebs-list-contact-paths) to find contact delivery paths for an organization.
          items:
            $ref: '#/components/schemas/ApiDeliveryPath'
        pathOrder:
          type: string
          description: Determines which ordering of delivery paths are used for this notification.
          enum:
          - CONTACT
          - ORGANIZATION
          - CUSTOM
        ttl:
          type: string
          description: "The amount of time, beginning at the communication's launch, to continue sending notifications (\"time-to-live\"). This is in formatted in the ISO 8601 \"duration\" format and must be specified as a number of whole hours.\n Supports a minimum value of one minute up to a maximum value of five days."
          example: PT5H
        deliveryRetries:
          type: integer
          description: The number of attempts to contact recipients that haven't responded.
          maximum: 20
        pathInterval:
          type: string
          description: How long the system should wait before attempting to contact the next device in a recipient's delivery paths. This is in formatted in the ISO 8601 "duration" format.
          enum:
          - PT0M
          - PT1M
          - PT2M
          - PT3M
          - PT5M
          - PT10M
          - PT15M
        deliveryInterval:
          type: string
          description: "How long the system should wait before attempting another delivery starting from the beginning of a recipient's delivery paths.\n Supported values are 0 minutes, 1 minute, 2 minutes, or multiples of 5 minutes up to 60 minutes."
          example: PT15M
        applyThrottle:
          type: boolean
          description: If set to true, will throttle the number of phone calls made.
        quietTimeOverride:
          type: boolean
          description: If set to true, then notifications from this communication will ignore recipients' quiet time settings (i.e. phone calls will be made despite the recipient opting to only receive them during a certain time range.)
    ContactRecipientExternalId:
      type: object
      description: Refers to a contact recipient by its contact external ID.
      required:
      - type
      - externalId
      properties:
        type:
          type: string
          description: Must be set to exactly `ExternalId`.
          enum:
          - ExternalId
        externalId:
          type: string
          description: The organization-provided contact external ID from the [Everbridge Contacts API](https://developers.everbridge.net/internal/reference/ebs-list-contacts).
    CommData:
      type: object
      properties:
        organizationId:
          type: string
          description: The Everbridge organization ID that owns the communication.
        commId:
          type: string
          description: The ID of the communication.
        status:
          type: string
          enum:
          - CANCELLED
          - FAILED
          - PROCESSING
          - READY
          - SCHEDULED
          - SENT
          description: "The current status of the communication:\n * `CANCELLED`: The communication was stopped before it could complete its entire lifecycle.\n * `FAILED`: The communication failed to send.\n * `PROCESSING`: The communication is currently being compiled and has not yet been sent.\n * `READY`: The communication has been compiled but has not yet been sent.\n * `SENT`: The communication has been sent and will begin notifying shortly."
        title:
          type: string
          description: The title of the communication.
        mode:
          type: string
          enum:
          - Live
          - Simulation
          - Preview
          description: "Describes the behavior of the communication:\n * `Live`: Launch the communication and send notifications to all recipients.\n * `Simulation`: Launch the communication but do not send notifications; useful for determining the impact of a communication before sending it with `Live`.\n * `Preview`: Render the template and its fields for preview but does not launch the communication nor send any notifications."
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: A list of tags assigned to the communication.
        notifications:
          type: array
          items:
            type: object
            properties:
              notificationId:
                type: string
                description: The ID of the notification.
              status:
                type: string
                enum:
                - CANCELLED
                - FAILED
                - PROCESSING
                - READY
                - SENT
                description: "The current status of the notification:\n * `CANCELLED`: The notification was stopped before it could complete its entire lifecycle.\n * `FAILED`: The notification failed to send.\n * `PROCESSING`: The notification is currently being compiled and has not yet been sent.\n * `READY`: The notification has been compiled but has not yet been sent.\n * `SENT`: The notification has been sent and will begin notifying shortly."
        priority:
          description: Priority of the communication
          example: NORMAL
          type: string
          enum:
          - NORMAL
          - HIGHPRIORITY
          - LIFETHREATENING
        name:
          description: Name of the communication.
          example: Test Communication
          type: string
        eventType:
          description: Type of event
          example: TODO
          type: string
        launchedBy:
          type: string
          description: The full name of the user who launched this communication
        publicSafety:
          type: boolean
          description: Communication is being sent as a Public Safety message
        launchedFrom:
          type: string
          description: The source of the communication launch. This is used for tracking purposes and does not affect the behavior of the communication. Public should use API.
          enum:
          - API
          - UI
          - ORCHESTRATION
          - CRITICALEVENT
          - SAFETYMESSAGE
          - COMMSSCHEDULE
          - RESPONSEMGMT
        sent:
          description: Time the communication was sent.
          example: Test Communication
          type: string
          format: date-time
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationSummary'
        threadStatus:
          description: Communication thread is active or inactive
          example: INACTIVE
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        planId:
          type: string
          description: The ID of the plan that launched the with communication, if any.
    PreviewCommResponse:
      type: object
      description: The rendered communication content for preview.
      properties:
        contents:
          type: object
          description: The rendered communication content, keyed by locale.
          additionalProperties:
            $ref: '#/components/schemas/MessageContent'
    SupportedLanguages:
      type: string
      description: "A combined language and region tag that signifies the default language to use when selecting a message body to send to a recipient.\n *Note:* Currently, all communication message bodies in a single communication are signified as being spoken or written in the language defined in this property."
      default: en_US
      enum:
      - ar_SA
      - bn_BD
      - cy_GB
      - da_DK
      - de_DE
      - el_GR
      - en_GB
      - en_US
      - es_ES
      - es_US
      - fi_FI
      - fr_FR
      - he_IL
      - ht_HT
      - id_ID
      - it_IT
      - ja_JP
      - ko_KR
      - nl_NL
      - no_NO
      - pl_PL
      - pt_BR
      - pt_PT
      - ru_RU
      - sv_SE
      - th_TH
      - tr_TR
      - uk_UA
      - ur_PK
      - vi_VN
      - yi_US
      - zh_CN
    VoiceSettings:
      type: object
      description: The caller ID number displayed when contacting recipients via phone.
      required:
      - countryCode
      - callerId
      - default
      properties:
        countryCode:
          type: string
          description: The ISO 3166 two-letter code for the country where this phone number is valid. Please refer to [the Wikipedia page on ISO 3166 country codes](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) for valid values.
        callerId:
          type: string
          description: The caller ID phone number in E. 164 format.
