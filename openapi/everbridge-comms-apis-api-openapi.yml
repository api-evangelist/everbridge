          type: string
          description: Must be set to exactly `PathId`.
          enum:
          - PathId
        pathId:
          type: string
          description: The path ID itself.
    ConfirmationSummary:
      description: A list of summaries associated with the communication. - STILL IN DEVELOPMENT
      type: object
      properties:
        totalCount:
          description: Total count of notifications sent
          type: integer
          example: '8'
        totalPublicCount:
          description: Total count of public users sent
          type: integer
          example: '3'
        confirmedCount:
          description: Count of confirmations received
          type: integer
          example: '3'
        pendingConfirmedCount:
          description: Count of confirmations pending
          type: integer
          example: '4'
        unreachableCount:
          description: Count of unreachable contacts
          type: integer
          example: '1'
        confirmedLateCount:
          description: Confirmations received after the expiration time
          type: integer
          example: '0'
    ContactRecipientName:
      type: object
      description: Refers to a contact recipient by their name as shown in the [Everbridge Contacts API](https://developers.everbridge.net/internal/reference/ebs-list-contacts).
      required:
      - type
      - firstName
      - lastName
      properties:
        type:
          type: string
          description: Must be set to exactly `Name`.
          enum:
          - Name
        firstName:
          type: string
          description: The contact's first or given name.
        middleInitial:
          type: string
          description: The contact's middle initial.
        lastName:
          type: string
          description: The contact's last name or surname.
        suffix:
          type: string
          description: A suffix to the contact's name.
          example: Jr.
    SocialMediaPublicMessage:
      type: object
