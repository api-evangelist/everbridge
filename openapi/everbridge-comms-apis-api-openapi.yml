      - body
      - stream
      properties:
        title:
          type: string
          description: The title of web widget message.
        body:
          type: string
          description: The core content of web widget message.
        ewwEndDate:
          type: string
          description: end date as an ISO 8601-compliant value to custom end data of web widget message.This value must be after the current date
          example: '2024-07-07T20:06:09.734385Z'
        stream:
          type: string
          description: The steam of web widget message.
        duration:
          type: string
          description: The amount of time, beginning at the web widget message launch, to expiring the message. This is in formatted in the ISO 8601 "duration" format.
          example: PT5H
