components:
  schemas:
    RestfulInstanceResult:
      properties:
        message:
          type: string
        result:
          type: object
      title: RestfulInstanceResult
      type: object
    NotificationEventWrapper:
      properties:
        accountId:
          format: int64
          type: integer
        createdDate:
          format: date-time
          type: string
        createdId:
          format: int64
          type: integer
        createdName:
          type: string
        createdProxyName:
          type: string
        id:
          format: int64
          type: integer
        lastModifiedDate:
          format: date-time
          type: string
        lastModifiedId:
          format: int64
          type: integer
        lastModifiedName:
          type: string
        lastModifiedProxyName:
          type: string
        name:
          type: string
        organizationId:
          format: int64
          type: integer
        resourceBundleId:
          format: int64
          type: integer
        status:
          enum:
          - A
          - D
          type: string
      title: NotificationEventWrapper
      type: object
    RestfulModificationResult:
      properties:
        baseUri:
          type: string
        id:
          format: int64
          type: integer
        instanceUri:
          type: string
        message:
          type: string
      title: RestfulModificationResult
      type: object
    updateNotification:
      allOf:
      - properties:
          notificationStatus:
            example: Stopped
            type: string
        required:
        - notificationStatus
        type: object
    organizationId:
      default: '1536984111644674'
      description: Everbridge Organization id.  Available on manager portal (Settings --> Organization --> Base Information)
      example: '1536984111644674'
      maxLength: 16
      type: integer
    RestfulCollectionResult:
      properties:
        currentPageUri:
          type: string
        firstPageUri:
          type: string
        lastPageUri:
          type: string
        message:
          type: string
        nextPageUri:
          type: string
        page:
          $ref: '#/components/schemas/DataPageObject'
        previousPageUri:
          type: string
      title: RestfulCollectionResult
      type: object
    notification:
      properties:
        broadcastContacts:
          description: Required if Source Template id is not provided.
          properties:
            externalIds:
              description: Comma separated list of externalIds.  ExternalIds can be found in Manager Portal under contacts.
              items:
                type: string
              type: array
            groupIds:
              description: Comma separated list of groupIds.  GroupIds can be found using /groups/{organizationId}
              items:
                type: string
              type: array
          required:
          - externalIds
          type: object
        broadcastSettings:
          description: Required if Source Template id is not provided.
          properties:
            deliverPaths:
              description: Contact delivery paths e.g. Phone, SMS, Email etc.
              items:
                properties:
                  id:
                    description: id returned from /contactPaths/{organizationId}
                    example: '589820879437825'
                    type: string
                required:
                - id
                type: object
              type: array
            senderCallerInfos:
              description: "Sender information for phone call. \n Required if Source Template id is not provided."
              items:
                properties:
                  callerId:
                    description: Phone number displayed as called ID
                    type: string
                  countryCode:
                    description: Two letter country code for the phone number
                    type: string
                  countryName:
                    description: Country name from the list of predefined countries for the phone number
                    type: string
                required:
                - callerId
                - countryCode
                - countryName
                type: object
              type: array
            senderEmail:
              description: ' Sender E-Mail Display'
              example: Internal+Training+(Dev3)
              type: string
          required:
          - deliverPaths
          - senderCallerInfos
          - senderEmail
          type: object
        launchtype:
          default: SendNow
          description: "Notification launch type. \n Required if Source Template id is not provided."
          enum:
          - SendNow
          type: string
        message:
          description: Required if Source Template id is not provided.
          properties:
            conferenceBridgeId:
              description: "Conference bridge id is configured in manager portal. \n Required only if type is :Conference."
              example: '1536984111644677'
              type: integer
            questionaire:
              properties:
                answers:
                  items:
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  type: array
              required:
              - answers
              type: object
            textMessage:
              type: string
            title:
              type: string
          required:
          - title
          - textMessage
          type: object
        sourceTemplateId:
          description: Source Template ID which can be found from manager portal. If you use a sourceTemplateId, you will NOT be able to override any elements of the notification template including the contacts.
          type: integer
        type:
          default: ''
          description: Required if Source Template id is not provided.
          enum:
          - Standard
          - Polling
          - Conference
          type: string
      type: object
    DataPageObject:
      properties:
        currentPageNo:
          format: int32
          type: integer
        data:
          items:
            type: object
          type: array
        dataPageList:
          items:
            $ref: '#/components/schemas/DataPageObject'
          type: array
        pageSize:
          format: int32
          type: integer
        scrollId:
          type: string
        start:
          format: int32
          type: integer
        totalCount:
          format: int64
          type: integer
        totalPageCount:
          format: int32
          type: integer
      title: DataPage«object»
      type: object
    createNotification:
      allOf:
      - $ref: '#/components/schemas/notification'
  securitySchemes:
    API_Authorizer:
      description: oAuth Token
      in: header
      name: Authorization
      type: apiKey
      x-amazon-apigateway-authorizer:
        authorizerCredentials: arn:aws:iam::214792946631:role/oas-rest-api-gw-prod-us-us-east-1-0-us-east-1-gw
        authorizerResultTtlInSeconds: 300
        authorizerUri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:214792946631:function:API_Authorizer_us-east-1_prod:live/invocations
        identitySource: method.request.header.Authorization,method.request.header.PathCacheKey,method.request.header.MethodCacheKey
        type: request
      x-amazon-apigateway-authtype: custom
    BasicAuth:
      description: Basic Authentication Token
      scheme: basic
      type: http
    api_key:
      description: API Key - For System Use
      in: header
      name: x-api-key
      type: apiKey
