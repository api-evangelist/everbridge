                          paths:
                          - CATEGORY:EMAIL
                      recipients:
                        groups:
                        - type: Id
                          id: '873461568734615'
                        - type: Name
                          name: MVPs
                    created: '2025-06-01T10:00:00Z'
                    createdBy: user-789
                    createdByName: Carol
                    updated: '2025-06-01T10:00:00Z'
                    updatedBy: user-789
                    updatedByName: Carol
        '400':
          description: 'Invalid value for: header Authorization, Invalid value for: parameters'
          content:
