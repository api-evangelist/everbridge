      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: The IDs of the properties to query by.
    MonthlyFrequency:
      type: object
      required:
      - type
      - daySelector
      - time
      properties:
        type:
          type: string
          enum:
          - Monthly
        interval:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 12
          description: Optional interval in months between executions (1-12).
        daySelector:
          type: object
          description: Selector for days in the month when the schedule triggers.
          oneOf:
          - type: object
            properties:
              dayCategory:
                type: string
                enum:
                - CalendarDay
              index:
                type: integer
                description: The calendar day index. 1-31 for the nth day of the month, -1 to -31 for counting backwards from the end (e.g., -1 is the last day of the month).
            required:
            - dayCategory
            - index
          - type: object
            properties:
              dayCategory:
                type: string
                enum:
                - WeekDay
              index:
                type: integer
                description: The week index in the month. 1-5 for the nth week from the start, -1 to -5 for counting backwards from the end (e.g., -1 is the last week of the month).
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
                description: The day of the week (1=Monday, 7=Sunday).
            required:
            - dayCategory
            - index
            - dayOfWeek
          - type: object
            properties:
              dayCategory:
                type: string
                enum:
                - WorkingDay
              index:
                type: integer
                description: The working day index in the month. 1-23 for the nth working day from the start, -1 to -23 for counting backwards from the end (e.g., -1 is the last working day of the month).
            required:
            - dayCategory
            - index
          - type: object
            properties:
              dayCategory:
                type: string
                enum:
                - NonWorkingDay
              index:
                type: integer
                description: The non-working day index in the month. 1-10 for the nth non-working day from the start, -1 to -10 for counting backwards from the end (e.g., -1 is the last non-working day of the month).
            required:
            - dayCategory
            - index
        time:
          type: string
          format: time
          description: The time of day when the schedule triggers (HH:mm:ss).
        timeZoneId:
          type:
          - string
          - 'null'
          description: Optional time zone identifier (e.g., `UTC`, `America/New_York`).
