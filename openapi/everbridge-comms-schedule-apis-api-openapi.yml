        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
  /schedules/{id}:
    get:
      tags:
      - Comms Schedule APIs
      operationId: getScheduleById
      summary: Get schedule by ID
      description: Retrieve a Comms Schedule by its unique identifier.
      parameters:
