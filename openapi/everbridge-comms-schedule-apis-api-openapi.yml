        responses:
          default:
            statusCode: '200'
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
components:
  schemas:
    AudioBulletinBoardPublicMessage:
      type: object
      description: The ABB public message content.
      required:
      - title
      - body
      - settingId
      properties:
        title:
          type: string
          description: The title of abb.
        body:
          type: string
          description: The core content of abb.
        settingId:
          type: string
          description: The setting id of abb that defined in setting page.
        audioKey:
          type: string
          description: 'The system-generated audio Key referring to the audio file for this message. '
        expires:
          type: string
          description: How long the message expires. This is in formatted in the ISO 8601 "duration" format.
          example: PT5H
    Facebook:
      type: object
      description: The Facebook custom message content.
      properties:
        body:
          type: string
          description: The core content sent to facebook.
        imageId:
          type: string
          description: The system-generated image ID referring to the image file that will be sent to facebook
        image:
          $ref: '#/components/schemas/ContentAttachment'
    LaunchMessageBody:
      type: object
      required:
      - contentType
      - title
      properties:
        contentType:
          type: string
          description: "A MIME type, defined in IETF's [RFC 6838](https://datatracker.ietf.org/doc/html/rfc6838), that describes the content type (e.g. `text/plain` for plain text or `audio/ogg` for an audio file). The content types that are valid for a given message body depends on the `type` of the message body:\n * `AudioMessageBody`: Supports only `audio` MIME types with any of its supported contact delivery path types.\n * `TextualMessageBody`: Supports only `text` MIME types with any of its supported contact delivery path types; for audio-only contact delivery path types, the text content will be translated to spoken audio via text-to-speech.\n * `WebPageMessageBody`: Supports only `text` MIME types with any of its supported contact delivery path types."
        title:
          type: string
          description: A title for the notification. For audio messages, this is used for display purposes within the Everbridge portal.
          minLength: 1
          maxLength: 255
    WeeklyFrequency:
      type: object
      required:
      - type
      - day_of_week
      - time
      properties:
        type:
          type: string
          enum:
          - Weekly
        interval:
          type:
          - integer
          - 'null'
          description: Optional interval in weeks between executions.
        day_of_week:
          type: array
          items:
            type: integer
          description: The days of the week (1=Monday, 7=Sunday) when the schedule triggers.
        time:
          type: string
          format: time
          description: The time of day when the schedule triggers (HH:mm:ss).
        timeZoneId:
          type:
          - string
          - 'null'
          description: Optional time zone identifier (e.g., 'UTC', 'America/New_York').
    RecurringScheduleConfig:
      type: object
      required:
      - type
      - startTime
      - frequency
      properties:
        type:
          type: string
          enum:
          - Recurring
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the schedule should start.
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the schedule should end.
        frequency:
          $ref: '#/components/schemas/RecurringFrequency'
    DeliverySettings:
      type: object
      description: Settings that adjust the way that notifications are delivered to recipients.
      properties:
        paths:
          type: array
          description: A list of contact delivery paths to use in notifying recipients. Refer to the [Everbridge List Contact Paths API](https://developers.everbridge.net/internal/reference/ebs-list-contact-paths) to find contact delivery paths for an organization.
          items:
            $ref: '#/components/schemas/ApiDeliveryPath'
        pathOrder:
          type: string
          description: Determines which ordering of delivery paths are used for this notification.
          enum:
          - CONTACT
          - ORGANIZATION
          - CUSTOM
        ttl:
          type: string
          description: "The amount of time, beginning at the communication's launch, to continue sending notifications (\"time-to-live\"). This is in formatted in the ISO 8601 \"duration\" format and must be specified as a number of whole hours.\n Supports a minimum value of one minute up to a maximum value of five days."
          example: PT5H
        deliveryRetries:
          type: integer
          description: The number of attempts to contact recipients that haven't responded.
          maximum: 20
        pathInterval:
          type: string
          description: How long the system should wait before attempting to contact the next device in a recipient's delivery paths. This is in formatted in the ISO 8601 "duration" format.
          enum:
          - PT0M
          - PT1M
          - PT2M
          - PT3M
          - PT5M
          - PT10M
          - PT15M
        deliveryInterval:
          type: string
          description: "How long the system should wait before attempting another delivery starting from the beginning of a recipient's delivery paths.\n Supported values are 0 minutes, 1 minute, 2 minutes, or multiples of 5 minutes up to 60 minutes."
          example: PT15M
        applyThrottle:
          type: boolean
          description: If set to true, will throttle the number of phone calls made.
        quietTimeOverride:
          type: boolean
          description: If set to true, then notifications from this communication will ignore recipients' quiet time settings (i.e. phone calls will be made despite the recipient opting to only receive them during a certain time range.)
    ContactRecipientExternalId:
      type: object
      description: Refers to a contact recipient by its contact external ID.
      required:
      - type
      - externalId
      properties:
        type:
          type: string
          description: Must be set to exactly `ExternalId`.
          enum:
          - ExternalId
        externalId:
          type: string
          description: The organization-provided contact external ID from the [Everbridge Contacts API](https://developers.everbridge.net/internal/reference/ebs-list-contacts).
    SupportedLanguages:
      type: string
      description: "A combined language and region tag that signifies the default language to use when selecting a message body to send to a recipient.\n *Note:* Currently, all communication message bodies in a single communication are signified as being spoken or written in the language defined in this property."
      default: en_US
      enum:
      - ar_SA
      - bn_BD
      - cy_GB
      - da_DK
      - de_DE
      - el_GR
      - en_GB
      - en_US
      - es_ES
      - es_US
      - fi_FI
      - fr_FR
      - he_IL
      - ht_HT
      - id_ID
      - it_IT
      - ja_JP
      - ko_KR
      - nl_NL
      - no_NO
      - pl_PL
      - pt_BR
      - pt_PT
      - ru_RU
      - sv_SE
      - th_TH
      - tr_TR
      - uk_UA
      - ur_PK
      - vi_VN
      - yi_US
      - zh_CN
    VoiceSettings:
      type: object
      description: The caller ID number displayed when contacting recipients via phone.
      required:
      - countryCode
      - callerId
      - default
      properties:
        countryCode:
          type: string
          description: The ISO 3166 two-letter code for the country where this phone number is valid. Please refer to [the Wikipedia page on ISO 3166 country codes](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) for valid values.
        callerId:
          type: string
          description: The caller ID phone number in E. 164 format.
        default:
          type: boolean
          description: If true, then this is the caller ID number used when no other applies.
    ApiDeliveryPathPathId:
      type: object
      description: A unique identifier for the delivery path.
      required:
      - type
      - pathId
      properties:
        type:
          type: string
          description: Must be set to exactly `PathId`.
          enum:
          - PathId
        pathId:
          type: string
          description: The path ID itself.
    ContactRecipientName:
      type: object
      description: Refers to a contact recipient by their name as shown in the [Everbridge Contacts API](https://developers.everbridge.net/internal/reference/ebs-list-contacts).
      required:
      - type
      - firstName
      - lastName
      properties:
        type:
          type: string
          description: Must be set to exactly `Name`.
          enum:
          - Name
        firstName:
          type: string
          description: The contact's first or given name.
        middleInitial:
          type: string
          description: The contact's middle initial.
        lastName:
          type: string
          description: The contact's last name or surname.
        suffix:
          type: string
          description: A suffix to the contact's name.
          example: Jr.
    SocialMediaPublicMessage:
      type: object
      description: The social media public message content.
      required:
      - tokenIds
      - incLink
      properties:
        body:
          type: string
          description: The title of social media.
        tokenIds:
          type: array
          description: The tokens of social media ,it can contain the token of  both twitter and facebook.
          items:
            type: string
        incLink:
          type: boolean
          description: Whether the message publish to social media contains a link
        imageId:
          type: string
          description: The system-generated image ID referring to the image file for this message..
        customContents:
          type: array
          description: The bodies of the custom social media  Each type at most has one item.
          items:
            anyOf:
            - $ref: '#/components/schemas/Facebook'
            - $ref: '#/components/schemas/Twitter'
    GenericOneWayPublicMessage:
      type: object
      description: The GenericOneWay public message content.
      required:
      - title
      - body
      - receiveUrls
      properties:
        title:
          type: string
          description: The title of generic one way.
        body:
          type: string
          description: The core content of generic one way.
        receiveUrls:
          type: string
          description: The receive url list of generic one way.
          items:
            type: string
    CemResultsCompleteName:
      type: object
      description: Used to describe a contact's complete name in a CEM Results query.
      required:
      - type
      - first
      - last
      properties:
        type:
          type: string
          description: Must be set to exactly `Complete`.
          enum:
          - Complete
        first:
          type: string
          description: The first name of the contact.
        last:
          type: string
          description: The last name of the contact.
        middleInitial:
          type: string
          description: The middle initial of the contact.
        suffix:
          type: string
          description: The suffix of the contact's name, such as "Jr." or "III".
    EverbridgeCommunityPublicMessage:
      type: object
      description: The Everbridge Community publish toggle. This message carries no body fields and is used only to signal routing/selection in the launch request.
    CreateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        scheduleConfig:
          $ref: '#/components/schemas/CommScheduleConfig'
        commsPayload:
          $ref: '#/components/schemas/LaunchCommRequest'
      required:
      - name
      - commsPayload
      - scheduleConfig
    MessageContent:
      required:
      - contents
      type: object
      description: Notification message content that is included within the communication. If a `templateId` is present, this value becomes optional and will override the template's message content if provided.
      properties:
        conferenceBridgeId:
          type: string
          description: The ID of a conference bridge for recipients to join. Retrieve conference bridge IDs from the [Everbridge List Conference Bridges API](https://developers.everbridge.net/internal/reference/ebs-list-conference-bridges). Note that this property is mutually exclusive with `questionnaire`; both may not be set in the same communication.
        questionnaire:
          type: object
          description: A list of answers to a provided question for recipients to respond with during confirmation. Note that this property is mutually exclusive with `conferenceBridgeId`; both may not be set in the same communication.
          required:
          - answers
          properties:
            answers:
              type: array
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: The user-friendly text of the questionnaire answer.
                  responseQuota:
                    type: integer
                    description: Defines a minimum number of recipients that must respond with this questionnaire answer.
            questionText:
              type: string
              description: The text prompt to display to recipients when they are responding to the questionnaire.
        contents:
          type: array
          description: The bodies of the notification message shown to recipients. There may be multiple `Textual` message bodies but at most one `Audio` message body and/or at most one `WebPage` message body.
          items:
            anyOf:
            - $ref: '#/components/schemas/AudioMessageBody'
            - $ref: '#/components/schemas/TextualMessageBody'
            - $ref: '#/components/schemas/WebPageMessageBody'
    activity:
      type: object
      properties:
        action:
          type: string
          enum:
          - FOLLOWUP
          - UPDATE
          - CLOSE
          description: Specify the type of activity. For example, use this to send an update or follow-up communication, or to close the target communication.
        target:
          type: string
          description: Launches a new communication as a follow-up to an existing communication. The target communication ID to which this communication is related.
    LaunchCommRequest:
      description: Request body for launching a communication. Only valid when `mode` is `LIVE` or `SIMULATION`.
      allOf:
      - $ref: '#/components/schemas/BaseLaunchCommRequest'
      - type: object
        required:
        - title
        - mode
        properties:
          mode:
            $ref: '#/components/schemas/LaunchMode'
          title:
            type: string
            description: The title or summary of the communication, shown in the Communications interface. This is not the title used in the notification.
          description:
            type: string
            description: A description of the communication. This is not shown to recipients.
            maxLength: 500
          publicSafety:
            type: boolean
            description: Communication is being sent as a Public Safety message
          priority:
            type: string
            description: "The level of urgency for this communication.\n * `NORMAL`: The baseline level of urgency.\n * `HIGHPRIORITY`: Action is recommended.\n * `LIFETHREATENING`: Immediate action is required due to the risk of loss of life or bodily harm."
            enum:
            - NORMAL
            - HIGHPRIORITY
            - LIFETHREATENING
          eventType:
            type: string
            description: A category for the communication.
          launchedFrom:
            type: string
            description: The source of the communication launch. This is used for tracking purposes and does not affect the behavior of the communication. Public should use API.
            enum:
            - API
            - UI
            - ORCHESTRATION
            - CRITICALEVENT
            - SAFETYMESSAGE
            - COMMSSCHEDULE
            - RESPONSEMGMT
          recipients:
            $ref: '#/components/schemas/LaunchRecipients'
          publicMessages:
            type: array
            description: The bodies of the public message. Each type at most has one body.
            items:
              anyOf:
              - $ref: '#/components/schemas/WebWidgetPublicMessage'
              - $ref: '#/components/schemas/AlertUsPublicMessage'
              - $ref: '#/components/schemas/GenericOneWayPublicMessage'
              - $ref: '#/components/schemas/AudioBulletinBoardPublicMessage'
              - $ref: '#/components/schemas/SocialMediaPublicMessage'
              - $ref: '#/components/schemas/MemberPortalPublicMessage'
              - $ref: '#/components/schemas/EverbridgeCommunityPublicMessage'
              - $ref: '#/components/schemas/NetworkPublicMessage'
              - $ref: '#/components/schemas/CAPPublicMessage'
          activity:
            $ref: '#/components/schemas/activity'
          planId:
            type: string
            description: Unique identifier of the plan responsible for launching the communication.
    BaseLaunchCommRequest:
      type: object
      properties:
        templateId:
          type: string
          description: 'An ID of a template to use for this communication. Supported template types:

            - Communication Template: IDs of the form `commsTemplate://{id}`

            - Notification Template (legacy): IDs of the form `legacyMN://{id}`

            - Incident Template (legacy): IDs of the form `legacyIC://{id}/{phaseName}`

            For legacy templates, you can retrieve template details via the `/templates/convert` API.'
          example: commsTemplate://bdbc6a41-ce36-4c14-9add-36306a46c95f
        context:
          type: object
          description: Various contextual properties to be used with `templateId`.
          properties:
            variables:
              type: array
              description: Variables to use within templates specified by `templateId`.
              items:
                type: object
                description: An individual variable ID and its value. The `value` property may take on multiple forms depending on the type of the variable specified in the [Variable Library](https://developers.everbridge.net/internal/reference/get_v1).
                properties:
                  variableId:
                    type: string
                    description: The ID of the variable, as described by the Variable Library.
                  value:
                    oneOf:
                    - type: string
                      description: "A single string value for a variable. This would include single selection variables, textbox variables, textarea variables, and date variables. \n\n*Note:* It is recommended to send the value for date variables as an ISO 8601 date and time string (`2024-11-19T14:01:31Z`). The Communications API will automatically format the value based on the specified formatting of the variable in the Variable Library."
                    - type: array
                      description: Specifies multiple values for a variable. This is intended to be used with the multiple selection variable only.
                      items:
                        type: string
            contextIds:
              type: array
              description: IDs of contextual objects to use in the template. Each ID takes the form of `shortName://sourceID` where `shortName` is the property of the same name from the Context APIs and the `sourceID` is the identifier from the context source. Please see the documentation on the Context APIs for more information.
              maxItems: 1
              items:
                type: string
        exercise:
          type: boolean
          description: Is enable exercise mode
        settings:
          $ref: '#/components/schemas/ApiSettings'
        message:
          $ref: '#/components/schemas/MessageContent'
    LaunchMode:
      type: string
      enum:
      - LIVE
      - SIMULATION
      description: "Adjust the behavior of the communication:\n * `LIVE`: Launch the communication and send notifications to all recipients. At least one recipient must be specified in `recipients`.\n * `SIMULATION`: Launch the communication but do not send notifications; useful for determining the impact of a communication before sending it with `Live`. At least one recipient must be specified in `recipients`."
    ContentAttachment:
      type: object
      properties:
        fileId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        downloadUrl:
          type: string
        size:
          type: integer
          format: int64
    Command:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of command to execute
    SenderSettings:
      type: object
      description: Specify what recipients will see as the "sender" of the notifications sent from the communication (e.g. caller ID upon receiving a phone call.)
      properties:
        email:
          type: object
          description: Configuration elements that control the display of the sender in email notifications.
          properties:
            name:
              type: string
              description: The display name used in email notifications.
            replyToEmail:
              type: string
              description: The "reply to" email address to use for email notifications.
        voice:
          type: array
          description: Configuration elements that control the display of the caller in phone call notifications.
          items:
            $ref: '#/components/schemas/VoiceSettings'
        sms:
          type: array
          description: Configuration elements that control the display of the sender in SMS notifications.
          items:
            $ref: '#/components/schemas/SmsSettings'
    CommSchedulePaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommScheduleBase'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int32
    CommSchedulePayloadBase:
      type: object
      required:
      - title
      - mode
      - tags
      - launchedFrom
      - publicSafety
      - name
      - priority
      properties:
        title:
          type: string
        mode:
          $ref: '#/components/schemas/LaunchMode'
        tags:
          type: array
          items:
            type: string
          description: distinct ordered tags
        publicSafety:
          type: boolean
        name:
          type: string
        priority:
          type: string
          description: "The level of urgency for this communication.\n * `NORMAL`: The baseline level of urgency.\n * `HIGHPRIORITY`: Action is recommended.\n * `LIFETHREATENING`: Immediate action is required due to the risk of loss of life or bodily harm."
          enum:
          - NORMAL
          - HIGHPRIORITY
          - LIFETHREATENING
        eventType:
          type: string
          description: A category for the communication.
        templateId:
          type: string
          description: An ID of a template to use for this communication. Only Communications template IDs of the form `commsTemplate://{id}` are supported at this time.
          example: commsTemplate://bdbc6a41-ce36-4c14-9add-36306a46c95f
        activity:
          $ref: '#/components/schemas/activity'
    YearlyFrequency:
      type: object
      required:
      - type
      - month
      - day_of_month
      - time
      properties:
        type:
          type: string
          enum:
          - Yearly
        interval:
          type:
          - integer
          - 'null'
          description: Optional interval in years between executions.
        month:
          type: integer
          description: The month of the year (1-12) when the schedule triggers.
        day_of_month:
          type: integer
          description: The day of the month (1-31) when the schedule triggers.
        time:
          type: string
          format: time
          description: The time of day when the schedule triggers (HH:mm:ss).
        timeZoneId:
          type:
          - string
          - 'null'
          description: Optional time zone identifier (e.g., 'UTC', 'America/New_York').
    CemResultsLastKnownLocationType:
      type: object
      description: Specifies how to include contacts with "Last Known" location types in CEM Results.
      required:
      - type
      properties:
        type:
          type: string
          description: Must be set to exactly `LastKnown`.
          enum:
          - LastKnown
        locationSourceIds:
          type: array
          description: A list of location source IDs.
          items:
            type: number
    ProblemDetail:
      type: object
      description: An RFC-7807 compliant model for error details.
      properties:
        type:
          type: string
          description: A URI that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP response status code describing the error.
        detail:
          type: string
          description: A human-readable explanation of the specific problem.
        instance:
          type: string
          description: A URI that identifies the specific problem.
    CemResultsNumberPropertyQuery:
      allOf:
      - $ref: '#/components/schemas/CemResultsPropertyQuery'
      - type: object
        required:
        - type
        description: Provides querying against numeric properties in Contacts and Assets.
        properties:
          type:
            type: string
            description: Must be set to exactly `Number`.
            enum:
            - Number
          lowerBound:
            type: number
            description: A lower bound to match against the properties.
          upperBound:
            type: number
            description: An upper bound to match against the properties.
    CapContent:
      type: object
      description: Shared CAP transport metadata for a public-safety delivery instance. The public-comms webpage shortUrl is not part of this content; it is system-generated and returned at the communication detail level.
      required:
      - capCategory
      - capEventType
      - capEventCode
      - capSeverity
      - capUrgency
      - capCertainty
      properties:
        capCategory:
          type: string
          description: CAP category.
        capEventType:
          type: string
          description: CAP event type.
        capEventCode:
          type: string
          description: CAP event code.
        capSeverity:
          type: string
          description: CAP severity.
        capUrgency:
          type: string
          description: CAP urgency.
        capCertainty:
          type: string
          description: CAP certainty.
    CemResultsExpectedLocationType:
      type: object
      description: Specifies how to include contacts with expected location types in CEM Results.
      required:
      - type
      properties:
        type:
          type: string
          description: Must be set to exactly `Expected`.
          enum:
          - Expected
    FixedIntervalScheduleConfig:
      type: object
      required:
      - type
      - startTime
      - timeInterval
      properties:
        type:
          type: string
          enum:
          - FixedInterval
        startTime:
          type: string
          format: date-time
          description: The date and time when the schedule should start.
        endTime:
          type: string
          format: date-time
          description: The date and time when the schedule should end.
        maxCount:
          type:
          - integer
          - 'null'
          description: The maximum number of times to run the schedule.
        timeInterval:
          type: string
          description: The time interval between executions of the schedule, in ISO 8601 duration format (e.g., 'PT1H' for 1 hour). in ISO 8601 perid format (e.g., 'P1M' for 1 month)..
          example: PT5H
    TextOnlyPathCategory:
      type: string
      description: A group of contact path types that only support textual messaging.
      enum:
      - CATEGORY:BUSINESSMESSAGINGAPPS
      - CATEGORY:COMMON
      - CATEGORY:EMAIL
      - CATEGORY:MOBILEAPP
      - CATEGORY:PLAINTEXT
      - CATEGORY:SMS
    ApiDeliveryPathPrompt:
      type: object
      description: The unique description, provided by the organization, for the delivery path.
      required:
      - type
      - prompt
      properties:
        type:
          type: string
          description: Must be set to exactly `Prompt`.
          enum:
          - Prompt
        prompt:
          type: string
