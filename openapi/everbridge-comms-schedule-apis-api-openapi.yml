                    scheduleConfig:
                      type: FixedInterval
                      startTime: '2025-06-01T08:00:00Z'
                      endTime: '2025-06-01T13:00:00Z'
                      maxCount: 5
                      timeInterval: PT1H
                    commsPayload:
                      title: System update reminder
                      mode: Live
                      priority: Normal
                      eventType: General
                      launchedFrom: API
                      message:
                        contents:
                        - type: Textual
                          contentType: text/plain
                          title: System update reminder
                          content: System update reminder.
                          paths:
                          - CATEGORY:EMAIL
                      recipients:
                        groups:
                        - type: Id
                          id: '873461568734615'
                        - type: Name
                          name: MVPs
                    created: '2025-05-01T10:00:00Z'
                    createdBy: user-456
                    createdByName: Bob
                    updated: '2025-05-01T10:00:00Z'
                    updatedBy: user-456
                    updatedByName: Bob
                Return a Recurring Schedule.:
                  summary: Return a Recurring Schedule
                  value:
                    id: d9f4c3e6-5f1a-4b7c-9e2f-4a8b9c1d2e13
                    status: Scheduled
                    name: Year End Notification
                    description: Send a notification every year on December 31st at noon
                    nextFiredTime: '2025-12-31T12:00:00Z'
                    scheduleConfig:
                      type: Recurring
                      startTime: '2025-12-31T12:00:00Z'
                      frequency:
                        type: Yearly
                        month: 12
                        day_of_month: 31
                        time: '12:00:00'
                        timeZoneId: America/Vancouver
                    commsPayload:
                      title: Year End System Notification
                      mode: Active
                      priority: Normal
                      eventType: General
                      launchedFrom: API
                      message:
                        contents:
                        - type: Textual
                          contentType: text/plain
