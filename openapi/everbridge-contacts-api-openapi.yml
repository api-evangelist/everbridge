      responses:
        '200':
          description: Get contact preferences for usage in mobile application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAccountSetting'
      security:
      - API_Authorizer: []
      x-amazon-apigateway-integration:
        httpMethod: get
        uri: https://mobilemember.everbridge.net/api/v2/contacts/preferences
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        passthroughBehavior: when_no_match
    patch:
      tags:
      - Contacts
      summary: Update Contact Preferences
      description: Update contact preferences for usage in mobile application.
      operationId: ebs-daa-update-contact-preferences
      parameters:
      - name: Client-Id
