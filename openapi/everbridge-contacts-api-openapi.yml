      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPreference'
        required: true
      responses:
        '200':
          description: Update contact preferences for usage in mobile application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPreference'
      security:
      - API_Authorizer: []
