components:
  schemas:
    SafeCorridorV2Request:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          description: Location latitude range [-90, 90]
          format: double
          example: 44.999326
        longitude:
          maximum: 180
          minimum: -180
          type: number
          description: Location longitude range [-180, 180]
          format: double
          example: -123.126128
        fakeGis:
          type: boolean
          description: fake Gis
        buttonId:
          type: integer
          description: Custom button id
          format: int64
        buttonName:
          type: string
          description: Custom button name
        phoneNumber:
          type: string
          description: Phone number
        interval:
          type: integer
          description: Interval
          format: int32
        timeUnit:
          type: string
          description: 'Time unit: Minutes/Hours'
        deviceId:
          type: string
          description: Device id
        serverHandled:
          type: boolean
          description: Is server handled
        deviceDate:
          type: string
          description: ISO 8601 UTC date representing the time a safety event was triggered from a mobile phone event (2025-05-09T15:20:00Z)
    ContactPreference:
      type: object
      properties:
        prioritySound:
          type: string
          description: Priority alert sound.
        nonPrioritySound:
          type: string
          description: Non-priority alert sound.
        criticalSound:
          type: string
          description: Critical alert sound.
    GisLocation:
      type: object
      properties:
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
        'null':
          type: boolean
    SafeCorridorServerHandledVo:
      type: object
      properties:
        safeCorridorId:
          type: integer
          format: int64
        intervalInSeconds:
          type: integer
          format: int64
        nextCheckInTime:
          type: string
        buttonId:
          type: integer
          format: int64
    PanicResponse:
      type: object
      properties:
        panicId:
          type: integer
          format: int64
        sessionId:
          type: string
        token:
          type: string
        archiveId:
          type: string
        appKey:
          type: string
    AccountV2Response:
      required:
      - accountId
      type: object
      properties:
        accountId:
          type: string
          description: Account Id
        firstName:
          type: string
          description: Account first name
        lastName:
          type: string
          description: Account last name
        contactId:
          type: string
          description: Account contact Id
        status:
          type: string
          description: Account status
    PanicOperationV2Response:
      type: object
      properties:
        sessionId:
          type: string
          description: OpenTok session id.
        archiveId:
          type: string
          description: Panic archive id.
        state:
          type: string
          description: The state of panic operation.
    SafetyV2Response:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: Safety Connection response id
          format: int64
    CheckinResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The stored ID of the check-in record
    CheckinRequest:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          description: Location latitude range [-90, 90]
          format: double
          example: 44.999326
        longitude:
          maximum: 180
          minimum: -180
          type: number
          description: Location longitude range [-180, 180]
          format: double
          example: -123.126128
        deviceDate:
          type: string
          description: ISO 8601 UTC date representing the time a safety event was triggered from a mobile phone event (2025-05-09T15:20:00Z)
    PanicV2Request:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          description: Location latitude range [-90, 90]
          format: double
          example: 44.999326
        longitude:
          maximum: 180
          minimum: -180
          type: number
          description: Location longitude range [-180, 180]
          format: double
          example: -123.126128
        fakeGis:
