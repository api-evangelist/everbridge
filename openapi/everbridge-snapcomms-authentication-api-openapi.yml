openapi: 3.2.0
info:
  title: SnapComms API Reference SnapComms Authentication API
  description: Authentication related API's
  version: v1
servers:
- description: API Url
  url: https://api.snapcomms.com/v1
- description: API Sandbox Url
  url: https://api.snapcomms.com/mock
security:
- bearerAuth: []
tags:
- name: SnapComms Authentication
  description: Authentication related API's
paths:
  /auth/token:
    post:
      tags:
      - SnapComms Authentication
      security: []
      summary: Token
      description: 'Gets an authentication token for the provided credentials

        '
      operationId: token
      parameters:
      - name: x-tenant-id
        in: header
        description: Format - uuid. the snapcomms organisation id
        required: true
        schema:
          type: string
      - name: x-api-key
        in: header
        description: the snapcomms api key associated with the user
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Bad Request - The provided x-tenant-id format is invalid
        '401':
          description: Unauthorized - the provided credentials are invalid
        '429':
          description: Failed - Rate limit is exceeded
components:
  schemas:
    Token:
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..Z7ClfuVH5X84OBnXaiIF21I7xfTbub6VX8A0rbWTyfg
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-readme:
  explorer-enabled: true
  proxy-enabled: true
