          integration.request.header.Authorization: context.authorizer.override_token
          integration.request.path.id: method.request.path.id
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        uri: https://ebs-restapi-prod-us.evbg.io/rest/users/{id}
    patch:
      description: Partially update a user. This can be used to add, update or remove a user property without passing the entire user object in the request.
      operationId: EBS Update User Partial
      parameters:
      - description: The user identifier to update. Use idType to specify internal user ID, SSO ID, or external ID.
        in: path
        name: id
        required: true
        schema:
          default: '0'
          example: '595799473913944'
          type: string
      - allowEmptyValue: false
        description: Whether to patch by internal user ID, SSO ID, or external ID.
        in: query
        name: idType
        required: false
        schema:
          default: id
          enum:
          - id
          - ssoId
          - externalId
          type: string
      requestBody:
        content:
          application/json-patch+json:
            examples:
              Assign a new role to user:
                summary: Assign a new role to user
                value:
                - op: add
                  path: /roleIds/-
                  value: 1
              Disable a user:
                summary: Set user status to Inactive
                value:
                - op: replace
                  path: /userStatus
                  value: Inactive
              Enable a user:
                summary: Set user status to Active
                value:
                - op: replace
                  path: /userStatus
                  value: Active
              Initiate roles for user:
                summary: Initiate roles for given user
                value:
                - op: add
                  path: /roleIds
                  value:
                  - 1
                  - 22
                  - 333
              Replace a role by another role:
                summary: Replace a role by another role
                value:
                - op: replace
                  path: /roleIds/value:1
                  value: 22
              Unassign a role to user:
                summary: Unassign a role to user
                value:
                - op: remove
                  path: /roleIds/value:1
              Update the linked contact:
                summary: Update the linked contactId and orgId
                value:
                - op: add
                  path: /contactId
                  value: 123
                - op: add
                  path: /contactOrgId
                  value: 123
              Update user with most properties:
                summary: Update an user with most properties
                value:
                - op: replace
                  path: /firstname
                  value: example
                - op: replace
                  path: /lastname
                  value: example
                - op: replace
                  path: /middlename
                  value: example
                - op: replace
                  path: /email
                  value: example@everbridge.com
                - op: replace
                  path: /secondaryEmail
                  value: example@everbridge.com
                - op: replace
                  path: /suffix
                  value: III
                - op: replace
                  path: /samlIdentity
                  value: '11'
                - op: replace
                  path: /timeZoneId
                  value: Pacific/Auckland
                - op: replace
                  path: /autoProvisionForEBU
                  value: true
                - op: replace
                  path: /apiAccess
                  value: true
                - op: replace
                  path: /defaultRoleId
                  value: 0
                - op: replace
                  path: /flowDesignerOrgs
                  value:
                  - '111'
                  - '222'
                  - '333'
            schema:
              items:
                $ref: '#/components/schemas/patchEntity'
              type: array
      responses:
        '200':
          content:
            application/json:
              examples:
                Updated:
                  summary: Success
                  value:
                    accountId: 1001
                    apiAccess: false
                    autoProvisionForEBU: true
                    defaultRoleId: 1
                    ebsupport: false
                    email: example@everbridge.com
                    firstname: example
                    fullName: ''
                    id: 10010101
                    lastname: example
                    middlename: ''
                    roleIds:
                    - 1
                    roleItems:
                    - defaultOrganization: true
                      defaultRole: true
                      organizationId: 100101
                      roleId: 1
                    samlIdentity: ''
                    suffix: III
                    timeZoneId: Pacific/Auckland
                    userStatus: Active
              schema:
                $ref: '#/components/schemas/UserVO'
          description: Success
        '400':
          content:
            application/json:
              examples:
                Invalid Request Input:
                  summary: Invalid Input
                  value:
                    code: 400
                    details:
                    - messages:
                      - Invalid firstname
                      - size must be between 1 and 40
                      path: /firstname
                    - messages:
                      - Invalid lastname
                      - size must be between 1 and 40
                      path: /lastname
                    - messages:
                      - size must be between 0 and 1
                      path: /middlename
                    - messages:
                      - Invalid email format
                      - size must be between 5 and 100
                      path: /email
                    - messages:
                      - Invalid email format
                      - size must be between 0 and 100
                      - Domain of Secondary Email needs to be different from Primary Email
                      - Secondary email is disabled
                      path: /secondaryEmail
                    - messages:
                      - The saml identity already exists
                      path: /samlIdentity
                    - messages:
                      - Must be II or III or Jr. or Sr
                      path: /suffix
                    - messages:
                      - Invalid contact id
                      - contactId and contactOrgId must be provided together or omitted together
                      path: /contactId
                    - messages:
                      - Invalid organization id
                      - contactId and contactOrgId must be provided together or omitted together
                      path: /contactOrgId
                    - messages:
                      - Account Admin can only have one role
                      - The role does not belong to the account
                      - This role <role ID> cannot be deleted or replaced because it is the only account administrator under the current account.
                      - Invalid role
                      path: /roleIds
                    - messages:
                      - Invalid timeZoneId
                      path: /timeZoneId
                    - messages:
                      - Invalid default role id
                      - Default role id is not applicable to account admin
                      path: /defaultRoleId
                    id: Request Id
                    message: Bad Request
                    status: 400
              schema:
                $ref: '#/components/schemas/CommonErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                Invalid Credentials:
                  summary: Invalid Credentials
                  value:
                    message: Invalid credentials
                    status: 401
              schema:
                properties:
                  message:
                    description: Error message
                    type: string
                  status:
                    description: Invalid or missing credentials
                    enum:
                    - '401'
                    type: string
                type: object
          description: Invalid Credentials
      security:
      - API_Authorizer: []
      - BasicAuth: []
      - api_key: []
      summary: Update User (Partial)
      tags:
      - Users
      x-amazon-apigateway-integration:
        httpMethod: PATCH
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.header.Authorization: context.authorizer.override_token
          integration.request.path.id: method.request.path.id
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        uri: https://ebs-restapi-prod-us.evbg.io/rest/users/{id}
    put:
