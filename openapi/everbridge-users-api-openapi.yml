                  value:
                    message: OK
                    result:
                      apiAccess: true
                      autoProvisionForEBU: true
                      contactId: 0
                      contactOrgId: 0
                      defaultRoleId: 0
                      email: string
                      firstName: string
                      flowDesignerOrgs:
                      - 111, 222, 333
                      id: 0
                      lastLoginDate: '2023-12-20T05:55:53.644Z'
                      lastModifiedDate: '2023-12-20T05:55:53.644Z'
                      lastModifiedName: string
                      lastModifiedProxyName: string
                      lastName: string
                      locked: true
                      middlename: string
                      owner: string
                      roleIds:
                      - 0
                      roles:
                      - id: 0
                        name: string
                        permissionScope:
                          accessToAllNotificationFeatures: true
                          addContactsToGroups: true
                          createContacts: true
                          createEditDeleteGroups: true
                          createEditDeleteSchedules: true
                          createEditViewCockpitWorkFlows: true
                          deleteContacts: true
                          incidentZones: true
                          incidentZonesRegistered: true
                          moveRemoveContactsFromGroups: true
                          onlyEditRulesWithSameRole: true
                          reopenIncident: true
                          restrictToIncidentSimulationOnly: true
                          restrictToSimulationOnly: true
                          restrictionEditDeleteTemplates: true
                          uploadContacts: true
                          viewCockpitWorkFlows: true
                          viewDownloadAllContacts: true
                          viewDownloadEditAllContacts: true
                        roleDataScope:
                          broadcastTemplateIds:
                          - 0
                          dynamicGroupIds:
                          - 0
                          groupIds:
                          - 0
                          incidentTemplateIds:
                          - 0
                          isEmpty: true
                          organizationId: 0
                          referenceId: 0
                          referenceType: string
                          roleId: 0
                        roleTemplate: EB
                      secondaryEmail: string
                      ssoUserId: string
                      suffix: string
                      userName: string
                      userStatus: Active
              schema:
                $ref: '#/components/schemas/getUser'
          description: Success
        '400':
          content:
            application/json:
              examples:
                Invalid Request Input:
                  summary: Invalid Input
                  value:
                    message: type mismatch exception
                    status: 400
              schema:
                properties:
                  message:
                    description: Error message
                    type: string
                  status:
                    description: Missing or invalid request input
                    enum:
