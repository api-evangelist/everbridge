      - id
      - firstName
      - lastName
    ContactBuilderPreviewResponse:
      allOf:
      - $ref: '#/components/schemas/BaseApiPaginatedResponse'
      - type: object
        description: A page of individual contacts that were added to the session.
        properties:
          data:
            type: array
            items:
              type: object
              description: A contact added to the current session.
              properties:
                id:
                  type: number
                  format: int64
                  description: The contact's system identifier.
                firstName:
                  type: string
                  description: The contact's first or given name.
                middleInitial:
                  type: string
                  description: The contact's middle initial.
                lastName:
                  type: string
                  description: The contact's last or family name.
                externalId:
                  type: string
                  description: The contact's identifier as defined by the organization.
                recordTypeId:
                  type: number
                  format: int64
                  description: The system identifier for the contact record type that the contact is assigned to.
                recordTypeName:
                  type: string
                  description: The name of the contact record type that the contact is assigned to.
                registerEmail:
                  type: string
                  description: The email address that the contact used to register with Everbridge.
                country:
                  type: string
                  description: The country the contact is located in, represented as an ISO 3166-1 alpha-2 country code.
                addresses:
                  type: array
                  description: A list of the contact's addresses uploaded to Everbridge.
                  items:
                    properties:
                      streetAddress:
                        type: string
                        description: The street address of the contact.
                      city:
                        type: string
                        description: The city of the contact.
                      state:
                        type: string
                        description: The state or province of the contact.
                      postalCode:
                        type: string
                        description: The postal or ZIP code of the contact.
                      country:
                        type: string
                        description: The country of the contact, represented as an ISO 3166-1 alpha-2 country code.
                      locationType:
                        type: string
                        description: Describes the type of address.
                      locationName:
                        type: string
                        description: The name of the location associated with the address.
                createdName:
                  type: string
                  description: The name of the user or system that created the contact.
                lastModifiedDate:
                  type: string
                  format: date-time
                  description: The date and time when the contact was last modified, in ISO 8601 format.
    ApiQuerySemanticQuery:
      type: object
      description: Include a set of individual contacts by a CEM Results `SemanticQuery`.
      properties:
        type:
          type: string
