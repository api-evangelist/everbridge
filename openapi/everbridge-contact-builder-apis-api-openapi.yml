    CreateSessionRequest:
      type: object
      description: Request body to start a new session.
      properties:
        data:
          $ref: '#/components/schemas/BucketData'
        threadSets:
          type: object
          description: A map of bucket names to result set IDs from a previous communication. By intersecting these result sets with the final results from the `thread` bucket, the service can recategorize results into the buckets they belonged to previously.
          properties:
            individual:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `individual` bucket.
            group:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `group` bucket.
            rule:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `rule` bucket.
            query:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `query` bucket.
            alert:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `alert` bucket.
            public:
              type: array
              items:
                type: string
              description: Result set IDs representing the set of recipients added to a previous communication through the `public` bucket.
    SemanticQuery:
      allOf:
      - $ref: '#/components/schemas/Command'
      description: A query use for generating a CEM Result built with semantic logic
      type: object
      properties:
        type:
          type: string
          description: The type of command to execute
          enum:
          - SemanticQuery
        inArea:
          $ref: '#/components/schemas/Geometry'
        starting:
          type: string
          format: date-time
          description: Optional start time for bounding the query. Affects some locations and travel itineraries.
        ending:
          type: string
          format: date-time
          description: Optional end time for bounding the query. Affects some locations and travel itineraries.
        ofTypeIds:
          type: array
          items:
            type: string
          description: A list of contact or asset type IDs to filter the results by.
        tagged:
          type: array
          items:
            type: string
          description: A list of tags to filter the results by.
        inPropertyIds:
          type: array
          items:
            type: string
          description: A list of property IDs to filter the results by.
        withProperties:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CemResultsBooleanPropertyQuery'
            - $ref: '#/components/schemas/CemResultsNumberPropertyQuery'
            - $ref: '#/components/schemas/CemResultsStringPropertyQuery'
          description: A list of property IDs to filter the results by.
        named:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CemResultsCompleteName'
          description: A list of names to filter the results by.
        identified:
          type: array
          items:
            type: string
          description: A list of identifiers to filter the results by.
        memberOfIds:
          type: array
          items:
            type: number
          description: A list of groups IDs to find members of.
        withLocationTypes:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CemResultsStaticLocationType'
            - $ref: '#/components/schemas/CemResultsLastKnownLocationType'
            - $ref: '#/components/schemas/CemResultsExpectedLocationType'
            - $ref: '#/components/schemas/CemResultsTravelLocationType'
          description: A list of location types to filter the results by.
        ofRuleIds:
          type: array
          items:
            type: number
          description: A list of rules to filter the results by.
        isExpatriate:
          type: boolean
          description: If true, include expatriates in the results for contact result sets.
        isVip:
          type: boolean
          description: If true, include VIPs in the results for contact result sets.
        subscribedToIds:
          type: array
          items:
            type: string
          description: A list of public feed IDs to retrieve subscribers for. Only applicable to `publicuser` result sets.
        forZipCodes:
          type: array
          items:
            type: string
          description: A list of zipcodes to filter subscribers. Only applicable to `publicuser` result set.
        sendToAorSubscriptions:
          type: boolean
          description: If true, include org area-of-responsibility subscriptions. Only applicable to `publicuser` result set.
    QueryResponseItemResultSetId:
      type: object
      description: A CEM Results identifier that was previously added to this bucket.
      properties:
        type:
          type: string
          enum:
          - ResultSetId
          description: Must be set to `ResultSetId`.
        id:
          type: string
          description: The CEM Result identifier.
          example: evbg+result:contact:my-contacts:1697471720114
      required:
      - type
      - id
    SummarySubsetCounts:
