        notificationId:
          type: number
          description: The ID of the notification to read the report log of.
          format: int64
        confirmationStatuses:
          type: array
          description: The list of confirmation statuses to include in the results. If empty, then contacts with any confirmation status will be included.
          items:
            type: string
