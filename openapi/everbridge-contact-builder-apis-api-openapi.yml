        group:
          $ref: '#/components/schemas/SummarySubsetTypes'
        rule:
          $ref: '#/components/schemas/SummarySubsetTypes'
        query:
          $ref: '#/components/schemas/SummarySubsetTypes'
        exclusion:
          $ref: '#/components/schemas/SummarySubsetTypes'
        alert:
          $ref: '#/components/schemas/SummarySubsetTypes'
        thread:
          $ref: '#/components/schemas/SummarySubsetTypes'
        public:
          $ref: '#/components/schemas/SummarySubsetTypes'
    CemResultsStaticLocationType:
