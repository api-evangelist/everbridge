        type:
          type: string
          description: A URI that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP response status code describing the error.
        detail:
          type: string
          description: A human-readable explanation of the specific problem.
        instance:
          type: string
          description: A URI that identifies the specific problem.
    ApiRuleId:
      type: object
      description: Include a set of individual contacts by whether they match a contact rule (filter).
      properties:
        type:
          type: string
          enum:
          - Id
          description: Must be set to `Id`.
        ruleId:
          type: integer
          format: int64
