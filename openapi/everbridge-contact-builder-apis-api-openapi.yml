            - $ref: '#/components/schemas/ApiPublicUserResultSet'
            - $ref: '#/components/schemas/ApiPublicUserSemanticQuery'
    QueryResponseItemResultSetCommandFixedSet:
      type: object
      description: A `FixedSet` command for basic storage of resolved contacts or public users.
      properties:
        type:
          type: string
          enum:
          - FixedSet
          description: Must be set to `FixedSet`.
        items:
          type: array
          items:
            type: object
            description: An individual contact or public user.
            properties:
              id:
                type: string
                description: The unique system identifier of the contact or public user.
              featureId:
                type:
                - string
                - 'null'
                description: Not currently used.
              domain:
                type: string
                enum:
                - contact
                - publicuser
                description: The domain of the item, which indicates whether the item is a contact or a public user.
              properties:
                type: object
                description: A map of the item's properties, such as its original source. The properties available vary based on the domain of the item and the features included in the result set.
              rank:
                type:
                - string
                - 'null'
                description: Not currently used.
            required:
            - id
            - domain
          description: The list of CEM Results IDs of the result sets to filter.
      required:
      - type
      - items
    QueryBucketData:
      type: object
      description: Data to be stored in a bucket that supports generic queries.
      properties:
        query:
          type: array
          description: A list of generic queries to be included in the bucket.
          maxItems: 10
          items:
            anyOf:
            - $ref: '#/components/schemas/ApiQueryResultSet'
            - $ref: '#/components/schemas/ApiQuerySemanticQuery'
            - $ref: '#/components/schemas/ApiQueryNotificationReportLog'
    ApiQueryNotificationReportLog:
      type: object
      description: Include a set of individual contacts and/or public users via the report log of an existing notification.
      properties:
        type:
          type: string
          enum:
          - NotificationReportLog
          description: Must be set to `NotificationReportLog`.
        notificationId:
          type: integer
          format: int64
          description: The unique system ID of the notification.
        confirmationStatuses:
          type: array
          description: The list of confirmation statuses to include in the results. If empty, then contacts with any confirmation status will be included.
          items:
            type: string
            enum:
            - Confirmed
            - Attempted
            - ConfirmedLate
            - Unreachable
            - Duplicate
            - Dismissed
        pollResponses:
          type: array
          description: When used with a polling notification, filters the results by the responses that the recipients responded with to the poll.
          items:
            type: string
        segment:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          default: 0
          description: A logical separator to enable combining different subsets of a notification report log. For instance, retrieving all of those recipients who did not respond as well as those who responded with a certain poll response.
      required:
      - type
      - notificationId
    ApiQueryResultSet:
      type: object
      description: Include a set of individual contacts by a CEM Results ID (Result Set Identifier).
      properties:
        type:
          type: string
          enum:
          - ResultSet
          description: Must be set to `ResultSet`.
        resultSetId:
          type: string
          description: The unique system ID of the CEM Results to include. Only IDs in the `contact` or `resultset` domains are valid.
          example: evbg+result:contact:my-contacts:1697471720114
      required:
      - type
      - resultSetId
    QueryResponseItemResultSetCommandFilter:
      type: object
      description: A `Filter` command for filtering another result set based on its items' properties.
      properties:
        type:
          type: string
          enum:
          - Filter
          description: Must be set to `Filter`.
        ids:
          type: array
          items:
            type: string
          description: The list of CEM Results IDs of the result sets to filter.
        properties:
          type: object
          description: A map of property names to the list of values to filter on. An item will be included in the results if it matches any of the values for any of the properties.
        features:
          type: boolean
          description: Whether to include the features of the items in the filtering.
      required:
      - type
      - ids
    CemResultsPropertyQuery:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          description: The IDs of the properties to query by.
    ContactBucketData:
      type: object
      description: Data to be stored in a bucket that supports individual contacts.
      properties:
        contacts:
          type: array
          description: A list of individual contacts to be included in the bucket.
          maxItems: 5000
          items:
            anyOf:
            - $ref: '#/components/schemas/ApiContactId'
            - $ref: '#/components/schemas/ApiContactExternalId'
    QueryResponseItemResultSetCommand:
      type: object
      description: The accumulated CEM Results command based on previous modifications to the bucket.
      properties:
        type:
          type: string
          enum:
          - ResultSetCommand
          description: Must be set to `ResultSetCommand`.
        id:
          type: string
          description: The unique system ID of the CEM Results command. The domain of the result set varies based on the `command`; valid domains may be any of `contact`, `publicuser`, `recipient`, or `resultset`. If the domain is `recipient` or `resultset`, then the tag will contain either `contact` or `publicuser` to help differentiate the type of results that will be returned from the command.
          example: evbg+result:recipient:comms-contact-builder-9e1077f6-91a2-4076-b301-fd9458a4ea3e:thread-notified-contact-0
        command:
          type: object
          description: The CEM Result command body.
          oneOf:
          - $ref: '#/components/schemas/SemanticQuery'
          - $ref: '#/components/schemas/QueryResponseItemResultSetCommandRecipientsOf'
          - $ref: '#/components/schemas/QueryResponseItemResultSetCommandFilter'
          - $ref: '#/components/schemas/QueryResponseItemResultSetCommandFixedSet'
      required:
      - type
      - id
      - command
    CemResultsLastKnownLocationType:
