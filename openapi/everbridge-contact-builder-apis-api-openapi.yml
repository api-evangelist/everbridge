            - Attempted
            - ConfirmedLate
            - Unreachable
            - Duplicate
            - Dismissed
        confirmedPathIds:
          type:
          - number
          - 'null'
          format: int64
          description: Not currently used.
      required:
      - type
      - notificationId
    ClearBucketsRequest:
      type: object
      description: Request body to clear all data from the listed buckets.
      required:
      - buckets
      properties:
        buckets:
          type: array
          minItems: 1
          description: The buckets to clear. At least one bucket must be supplied.
          items:
            type: string
            enum:
            - individual
            - group
            - rule
            - query
            - exclusion
            - alert
            - thread
            - public
    ModificationRequest:
      type: object
      description: Request body to modify an existing session.
      properties:
        data:
          $ref: '#/components/schemas/BucketData'
      required:
      - data
    ApiSession:
      type: object
      description: The current session metadata.
      properties:
        sessionId:
          type: string
          description: The unique identifier for the newly created session.
          example: 73ef9c42-df40-41c8-9b2d-6618ed5c31c1
        created:
          type: string
          format: date-time
          description: The created time of the session in ISO 8601 format.
          example: '2024-07-03T20:06:09.734385Z'
        expiration:
          type: string
          format: date-time
          description: The expiration time of the session in ISO 8601 format.
          example: '2024-07-03T20:06:09.734385Z'
        buckets:
          type: array
          description: A list of buckets created in the session.
          items:
            type: string
            description: The unique identifier for each bucket created in the session.
        status:
          type: string
          description: 'The current status of the session.


            * `IDLE`: The session is idle and ready for additional modifications to its buckets.

            * `PROCESSING`: The session is currently processing modifications to its buckets.

            * `FINALIZING`: The session is currently generating result sets based on the contents of the buckets. The session will not accept new modifications to its buckets.

            * `COMPLETED`: The session has been completed and no further modifications can be made.

            * `FAILED`: The session failed to create result sets based on the contents of the buckets.'
          enum:
          - IDLE
          - PROCESSING
          - FINALIZING
          - COMPLETED
          - FAILED
        estimationMode:
          type: boolean
          description: 'If `true`, the session is in estimation mode. This implies that the summary may return estimates of the totals instead of exact counts and the contacts returned from the preview may be a subset of the total contacts that match the buckets.


            Note that the generated result sets from completing the session are always exact and are not based on estimates, regardless of whether the session is in estimation mode or not.'
    QueryResponse:
      type: object
      description: The CEM Results commands/result set IDs that were generated based on the modifications made to the session.
      properties:
        individual:
          $ref: '#/components/schemas/QueryResponseBucket'
        group:
          $ref: '#/components/schemas/QueryResponseBucket'
        rule:
          $ref: '#/components/schemas/QueryResponseBucket'
        query:
          $ref: '#/components/schemas/QueryResponseBucket'
        exclusion:
          $ref: '#/components/schemas/QueryResponseBucket'
        alert:
          $ref: '#/components/schemas/QueryResponseBucket'
        thread:
          $ref: '#/components/schemas/QueryResponseBucket'
        public:
          $ref: '#/components/schemas/QueryResponseBucket'
    Command:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of command to execute
    ApiPublicUserResultSet:
