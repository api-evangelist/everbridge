  /contact-builder/{sessionId}/result:
    post:
      tags:
      - Contact Builder APIs
      operationId: endSession
      summary: End Session
      description: End the session. This will begin generating and creating Result Sets. The CEM Results IDs, sorted by bucket, are returned upon successful completion.
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
        description: The unique identifier for the session.
      responses:
        '201':
          description: The session has ended and the result sets have been created. The result set IDs will be available from this endpoint for up to ten minutes after the session has completed. After ten minutes, the session and its results will no longer be available from this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
              examples:
                Successful End of the Session:
                  summary: Successful End of the Session
                  value:
                    individual:
                    - evbg+result:contact:my-contacts:1697471720114
                    group: []
                    rule: []
                    query: []
                    exclusion: []
                    alert: []
                    thread: []
        '202':
          description: The process of ending the session is taking longer than expected. The process will continue in the background; please try the request again to retrieve the results when they are ready.
        '400':
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                Single validation error:
                  summary: Single validation error
                  value:
                    type: /client-error/invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: 'The "Field Name #1" field must not be empty.'
                    instance: request-id
                Multiple validation errors:
                  summary: Multiple validation errors
                  value:
                    type: /client-error/invalid-parameter
                    title: Bad Request
                    status: 400
                    detail: 'The "title" field must not be empty.

                      The "eventType" field must not be empty.

                      The "Field Name #1" field must not be empty.'
                    instance: request-id
        '401':
          description: The token provided does not have permission to access this API.
        '404':
          description: The session does not exist.
        '500':
          description: An internal error has occurred. This may not always return a response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                An internal server error has occurred:
                  summary: An internal server error has occurred
                  value:
                    type: about:blank
                    title: Internal Server Error
                    status: 500
                    detail: null
                    instance: request-id
      security:
      - API_Authorizer: []
      x-amazon-apigateway-integration:
        type: http_proxy
        connectionId: 11ofco
        httpMethod: POST
        uri: https://prod-us-us-east-1-0-os-nginx.ue1-0.prod-us.prod.us-east-1.evbg.io/cem-comms/contact-builder/{sessionId}/result
        responses:
          default:
            statusCode: '201'
        requestParameters:
          integration.request.path.sessionId: method.request.path.sessionId
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
components:
  schemas:
    ContactsFromCsvResult:
      type: object
      properties:
        success:
          type: boolean
        resultCode:
          type: integer
        message:
          type:
          - string
          - 'null'
        processedCSVRecordCount:
          type: integer
        externalIdCount:
          type: integer
        contactCount:
          type: integer
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        additionalInfos:
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - success
      - resultCode
      - processedCSVRecordCount
      - externalIdCount
      - contactCount
      - contacts
    QueryResponseBucket:
      type: array
      items:
        anyOf:
        - $ref: '#/components/schemas/QueryResponseItemResultSetCommand'
        - $ref: '#/components/schemas/QueryResponseItemResultSetId'
    RuleBucketData:
      type: object
      description: Data to be stored in a bucket that supports contact rules (filters).
      properties:
        rules:
          type: array
          description: A list of contact rules (filters) to be included in the bucket
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApiRuleId'
    SummaryCounts:
      type: object
      description: A summary of the number of contacts within each bucket in a session. A bucket may not be present if it has no contacts.
      required:
      - total
      - buckets
      properties:
        total:
          type: integer
          format: int64
          description: The total number of contacts across all buckets in the session. The `exclusion` bucket is subtracted from the total.
        buckets:
          type: object
          description: A map of bucket names to the number of contacts in each bucket.
          properties:
            individual:
              type: integer
              format: int64
              description: The number of contacts in the "individual" bucket.
            group:
              type: integer
              format: int64
              description: The number of contacts in the "group" bucket.
            rule:
              type: integer
              format: int64
              description: The number of contacts in the "rule" bucket.
            query:
              type: integer
              format: int64
              description: The number of contacts in the "query" bucket.
            exclusion:
              type: integer
              format: int64
              description: The number of contacts in the "exclusion" bucket.
            alert:
              type: integer
              format: int64
              description: The number of contacts in the "alert" bucket.
            thread:
              type: integer
              format: int64
              description: The number of contacts in the "thread" bucket.
        subsets:
          $ref: '#/components/schemas/SummarySubsetCounts'
        public:
          type: object
          description: The counts of public users within the session's buckets.
          properties:
            provisionalCount:
              type: integer
              format: int64
              description: A provisional count of the total number public users that are a part of this session. The actual number may be lower than this number when the session is ended.
            subscribedToIds:
              type: array
              description: The aggregated list of known subscription IDs that are included in the session.
              items:
                type: string
            buckets:
              type: object
              description: A map of bucket names to the number of public users in each bucket.
              properties:
                individual:
                  $ref: '#/components/schemas/PublicBucketSummary'
                group:
                  $ref: '#/components/schemas/PublicBucketSummary'
                rule:
                  $ref: '#/components/schemas/PublicBucketSummary'
                query:
                  $ref: '#/components/schemas/PublicBucketSummary'
                exclusion:
                  $ref: '#/components/schemas/PublicBucketSummary'
                alert:
                  $ref: '#/components/schemas/PublicBucketSummary'
                thread:
                  $ref: '#/components/schemas/PublicBucketSummary'
                public:
                  $ref: '#/components/schemas/PublicBucketSummary'
            subsets:
              $ref: '#/components/schemas/SummarySubsetCounts'
    Contact:
      type: object
