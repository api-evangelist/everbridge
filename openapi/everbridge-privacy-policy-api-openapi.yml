                      data:
                      - policyId: 1954967644536947
                        policyItems:
                        - category: contactSection
                          nameIdentity: GENERAL_INFORMATION
                          permission: VIEW_AND_EDIT
                        - category: contactSection
                          nameIdentity: DELIVERY_METHODS
                          permission: VIEW_ONLY
                        - category: contactSection
                          nameIdentity: STATIC_LOCATIONS
