openapi: 3.2.0
info:
  description: EB Suite APIs.
  title: EB Suite Nixle Region Ids API
  version: '1.0'
servers:
- url: https://api.everbridge.net/rest
- url: https://api.everbridge.eu/rest
tags:
- description: EB Suites - Get City/Town, County or ZIP Code within jurisdiction
  name: Nixle Region Ids
paths:
  /nixleRegionIds/{organizationId}:
    get:
      description: Get City/Town, County or ZIP Code within jurisdiction
      operationId: EBS List Nixle Region Ids
      parameters:
      - description: The ID of the organization
        in: path
        name: organizationId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NixleRegionIdCollectionResult'
          description: OK
        '400':
          description: Missing or invalid request input
        '401':
          description: Invalid or missing credentials
        '500':
          description: Internal Error
      security:
      - BasicAuth: []
      - API_Authorizer: []
      - api_key: []
      summary: List Nixle Region Ids
      tags:
      - Nixle Region Ids
      x-amazon-apigateway-integration:
        httpMethod: GET
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.path.organizationId: method.request.path.organizationId
        responses:
          default:
            statusCode: '200'
        type: http_proxy
        uri: https://ebs-restapi-prod-us.evbg.io/rest/nixleRegionIds/{organizationId}
components:
  schemas:
    NixleRegionIdCollectionResult:
      properties:
        cities:
          items:
            $ref: '#/components/schemas/NixleRegion'
          type: array
        counties:
          items:
            $ref: '#/components/schemas/NixleRegion'
          type: array
        zipcodes:
          items:
            $ref: '#/components/schemas/NixleRegion'
          type: array
      type: object
    NixleRegion:
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        state:
          type: string
      type: object
  securitySchemes:
    API_Authorizer:
      description: oAuth Token
      in: header
      name: Authorization
      type: apiKey
      x-amazon-apigateway-authorizer:
        authorizerCredentials: arn:aws:iam::214792946631:role/oas-rest-api-gw-prod-us-us-east-1-0-us-east-1-gw
        authorizerResultTtlInSeconds: 300
        authorizerUri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:214792946631:function:API_Authorizer_us-east-1_prod:live/invocations
        identitySource: method.request.header.Authorization,method.request.header.PathCacheKey,method.request.header.MethodCacheKey
        type: request
      x-amazon-apigateway-authtype: custom
    BasicAuth:
      description: Basic Authentication Token
      scheme: basic
      type: http
    api_key:
      description: API Key - For System Use
      in: header
      name: x-api-key
      type: apiKey
x-amazon-apigateway-binary-media-types:
- audio/wav
- audio/x-wav
- application/octet-stream
x-readme:
  explorer-enabled: true
  proxy-enabled: true
