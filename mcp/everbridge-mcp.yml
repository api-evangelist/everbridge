status: live-gated
description: >-
  Everbridge serves a Model Context Protocol endpoint from its own developer hub host,
  developers.everbridge.net/mcp. A JSON-RPC POST of tools/list and of initialize both return
  HTTP 401 with {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization required"}},
  so the endpoint is live and MCP-shaped but the tool set is authentication-gated. The
  response carries ReadMe's CORS allow-list (x-readme-conversation-id, x-readme-project-id,
  x-readme-ai-metadata), which identifies this as the MCP surface ReadMe exposes for the
  Everbridge API Developer Hub's own API reference.
