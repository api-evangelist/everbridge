# REPLACES the 2026-05-04 bulk-sweep scaffold, which invented three priced tiers
# (Free / Professional / Enterprise) with a 1,000-request free quota and TBD overage
# pricing. Everbridge publishes NO pricing at all. Nothing below is inferred.
tags:
- Critical Event Management
- Emergency Management
- Pricing
description: >-
  Everbridge publishes no public pricing, no plan comparison and no self-serve signup for
  the Everbridge 360 platform or its APIs. https://www.everbridge.com/pricing/ returns 404,
  as does https://www.everbridge.com/free-trial/; the site's only commercial entry point is
  a demo request form. API access is not sold separately — it is included with an Everbridge
  Suite subscription and provisioned through the authenticated Manager Portal by creating a
  service account. The only tiering Everbridge documents publicly is the Bronze/Silver/Gold
  API throttling ladder, which is explicitly free of charge at every level and is captured
  in rate-limits/everbridge-rate-limits.yml, not here.
plan_count: 0
pricing_model: enterprise-quote
self_serve_signup: false
free_trial: false
plans: []
api_entitlement:
  included_with: Everbridge Suite / Everbridge 360 subscription
  provisioned_via: >-
    Manager Portal service-account workflow (Users -> Service Accounts at account level,
    Settings -> Access -> Service Accounts at organization level)
  paid_add_ons_observed:
  - name: Everbridge Risk Intelligence Feed API
    note: >-
      The 25.6 changelog entry for the Risk Intelligence Feed API is marked "Requires
      subscription", so at least one API surface is a separately licensed add-on. No price
      is published.
    source: https://developers.everbridge.net/home/changelog
  free_api_features_observed:
  - name: Custom Role Management APIs
    note: Changelog 26.1 states availability is free for all API customers.
  - name: User PATCH enable/disable
    note: Changelog 26.2 states availability is free for all API customers.
  - name: CMDB Group Lookup APIs
    note: Changelog 25.11 states availability is free for all customers.
