deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Everbridge publishes no formal deprecation or sunset policy, sets no Deprecation or
    Sunset response headers, and marks no operation `deprecated: true` in any of the 13
    OpenAPI documents (473 operations checked). Deprecation is communicated only in prose in
    the changelog. This is a real gap: an agent cannot detect a retiring endpoint from the
    contract or from a response header.
  deprecated_features:
  - name: Access Token authentication
    status: legacy
    stated_as: >-
      "Access Token is a legacy authentication method" — Everbridge directs organizations
      that still require it to a support-site enablement article.
    replacement: OAuth 2.0 client-credentials or password grant
    sunset_date: null
    source: https://developers.everbridge.net/home/docs/ebs-gs-guide-authentication-types
  behaviour_changes_announced:
  - release: '25.11 / 26.0 / 26.1'
    endpoint: /scheduling/shiftSchedules
    change: invalid ID response changed from 500 to 404
    breaking_for: clients branching on 500
  - release: '26.3'
    endpoint: /contact and its batch variants
    change: duplicate Location Name + Location Type combinations now rejected
    breaking_for: clients that relied on duplicates being accepted
status_page:
  published: false
  probed:
  - url: https://status.everbridge.com/
    status: 000
    result: >-
      Host does not resolve (NXDOMAIN). This URL was carried as a StatusPage pointer in
      apis.yml until this pass and has been removed as confirmed dead.
    checked: '2026-08-27'
  - url: https://everbridge.statuspage.io/
    status: 200
    result: >-
      Redirects to /inactive and renders "Everbridge old Status - Page Inactive". The legacy
      Statuspage instance has been retired and not replaced.
    checked: '2026-08-27'
  - url: https://status.everbridge.net/
    status: 000
    result: Host does not resolve.
    checked: '2026-08-27'
  sibling_brands_with_status_pages:
  - brand: xMatters
    url: https://status.xmatters.com/
    status: 200
  - brand: SnapComms
    url: https://status.snapcomms.com/
    status: 200
  note: >-
    Two Everbridge-owned brands publish live status pages while the core Everbridge 360 /
    Everbridge Suite platform publishes none. For a critical-event-management vendor whose
    entire value proposition is operating during disruption, an absent platform status page
    is the most conspicuous operational-transparency gap in this profile. No StatusPage
    pointer is emitted for Everbridge, because pointing at a subsidiary's status page would
    misstate what Everbridge itself serves.
sla:
  published: false
  note: >-
    No public SLA document. Availability commitments are contractual; the Trust Center
    (https://trust.everbridge.com/) is where business-continuity and DR documentation is
    requested under NDA.
