  - type: Overlay
    url: overlays/everbridge-cem-alerts-query-public-overlay.yaml
  - type: APIReference
    url: https://developers.everbridge.net/home/reference/cema-query-public
- aid: everbridge:everbridge-cem-alerts-stream-api
  name: Everbridge CEM Alerts Stream API
  description: >-
    A GraphQL subscription surface delivering the live CEM alerts stream over WebSocket — alert
    identity and status, the latest event with its title and impact-geometry correlations, and
    alert actions with the acting user. This is the only push/event surface Everbridge publishes;
    the platform ships no webhook catalogue and no AsyncAPI document.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference/cema-query-stream-1
  baseURL: https://api.everbridge.net/cem-alerts/stream/v1
