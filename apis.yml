- name: Everbridge iPaaS API
  description: >-
    The Everbridge iPaaS (Integration Platform as a Service) surface lets IT organizations build
    integrations with monitoring and service management tools — APM, NPM, ITOM, SIEM, DevOps and
    ITSM systems — mapping technology integrations to existing workflows and triggering Everbridge
    IT Alerting notifications with a no-code to low-code approach. No OpenAPI is published for this
    surface; it is configured through the self-service integration guide.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: >-
    https://www.everbridge.com/products/it-alerting/integrations/ipaas-self-service-integration-guide/
  baseURL: https://ipaas-ingestion.everbridge.net
