- aid: everbridge:everbridge-snapcomms-api
  name: SnapComms API
  description: >-
    SnapComms is an Everbridge company and its internal-communications API is documented on the
    Everbridge developer hub — 24 operations for authentication, group and attribute targeting,
    content and templates, user and machine management, and utility endpoints, delivering desktop
    alerts, tickers, screensavers and other high-visibility employee messaging. It is the only
    Everbridge-family contract that declares a sandbox server alongside production, and the only
    one that declares 429 responses.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference/snapcomms-authentication
  baseURL: https://api.snapcomms.com/v1
