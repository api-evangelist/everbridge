    url: https://developers.everbridge.net/home/docs/ebs-gs-guide-authentication-types
  - type: APIReference
    url: https://developers.everbridge.net/home/reference/generate-token
- aid: everbridge:everbridge-communications-api
  name: Everbridge Communications API
  description: >-
    The unified Communications API — 103 operations for launching, stopping and reporting on
    multi-channel communications, plus templates, template categories and reservations, global
    templates, plans, schedules, variables, contact builders and message builders. It is the only
    Everbridge surface with an explicit reversal path (PATCH /{commId}/stop) and it carries the
    platform's OASIS Common Alerting Protocol model, with CAP delivery modalities for IPAWS,
    CAP_GOOGLE and CAP_RSS.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference/comms-apis
  baseURL: https://api.everbridge.net/managerapps/communications/v1
  tags:
