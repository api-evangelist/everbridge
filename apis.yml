- aid: everbridge:everbridge-cem-alerts-query-api
  name: Everbridge CEM Alerts Query API
  description: >-
    A GraphQL query surface over the Critical Event Management alert store. A single POST /graphql
    operation accepts queries against alert(id) and alerts(filter, token), returning alert status,
    ownership, expiry, snooze state, system links and coordinate summaries. Introspection is
    authentication-gated.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference/cema-query-public
  baseURL: https://api.everbridge.net/cem-alerts/query/v1
  tags:
