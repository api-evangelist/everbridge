- aid: everbridge:everbridge-authentication-api
  name: Everbridge Suite OAuth Authentication API
  description: >-
    The token service for the Everbridge Suite. A single operation exchanges service-account
    credentials for a bearer token using either the OAuth 2.0 client-credentials grant (returning
    an access_token) or the password grant (returning an id_token). Tokens are valid for 28800
    seconds and an optional roleId header selects which role a multi-role user's token is minted for.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference/generate-token
  baseURL: https://api.everbridge.net/authorization/v1
  tags:
  - Authentication
  - OAuth
  - Tokens
  properties:
