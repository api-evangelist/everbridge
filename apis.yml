- aid: everbridge:everbridge-digital-apps-api
  name: Everbridge Digital Apps API
  description: >-
    Digital Apps brings Everbridge notification functionality into a company's own mobile, desktop
    and web applications from the perspective of an Everbridge contact — 69 operations for
    authorization, contact profile management, device registration for push, notification message
    retrieval and response, incidents, file resources, check-ins, safe corridors, scheduling and
    staff substitutions, and internal mobile organization configuration.
