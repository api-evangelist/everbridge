apis:
- aid: everbridge:everbridge-eb-suite-api
  name: Everbridge Suite API
  description: >-
    The Everbridge Suite REST API is the platform's core surface — 201 operations across 44 tagged
    resource groups covering contacts, contact attributes and filters, groups and dynamic groups,
    users, roles and custom roles, organizations, incidents and incident scenarios, mass and push
    notifications, notification templates and categories, scheduling (calendars, shift schedules,
    staff schedules, substitutions), conference bridges, locations and expected locations, shape
    library, uploads, reports, audit log, Nixle public-safety event groups and regions, and IPAWS
    public alerting. It includes a Preview Incident operation that renders an incident without
    launching it.
  image: https://www.everbridge.com/wp-content/uploads/2021/01/everbridge-logo.svg
  humanURL: https://developers.everbridge.net/home/reference
  baseURL: https://api.everbridge.net/rest
  tags:
  - Contacts
  - Notifications
  - Incidents
  - Groups
  - Scheduling
  - Public Warning
