name: Everbridge
description: >-
  Everbridge is a global critical event management (CEM) software company whose platform helps
  organizations anticipate, manage and respond to disruption — unifying risk intelligence, mass
  communication and coordinated response across people, assets, operations and public safety
  environments. The Everbridge 360 platform serves over 6,500 customers across business services,
  energy and utilities, federal and local government, healthcare, financial services, higher
  education, manufacturing and transportation. Its API estate is published on a public ReadMe
  developer hub as thirteen OpenAPI documents covering roughly 473 operations: the EB Suite REST
  API (contacts, groups, users, incidents, notifications, scheduling, calendars, locations,
  conference bridges, custom roles), a Communications API with native OASIS Common Alerting
  Protocol and FEMA IPAWS delivery, a GraphQL CEM Alerts query and subscription stream, asset
  management and query, digital apps for mobile and desktop notification, travel risk
  intelligence, safety devices, risk events, and the SnapComms internal-communications API.
