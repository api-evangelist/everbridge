- aid: everbridge:everbridge-risk-intelligence-api
  name: Everbridge Risk Intelligence API
  description: >-
    The Risk Intelligence Feed exposes RIMC-generated risk events, global highlights, situation
    reports and advisories for consumption outside the Everbridge platform. Filterable by date and
    time, category, severity, event status and geographic area, returning up to 1,000 results per
    invocation across a year of history. Requires a separate subscription.
