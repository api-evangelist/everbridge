specification: API Evangelist Packages
generated: '2026-08-27'
method: searched
source: >-
  registry.npmjs.org search, pypi.org/pypi/*/json, rubygems.org/api/v1/search.json,
  azuresearch-usnc.nuget.org, proxy.golang.org, api.github.com/orgs/Everbridge
provider: Everbridge
providerId: everbridge
description: >-
  Client-library census for the Everbridge API surface. FINDING: Everbridge publishes no
  first-party SDK to any public package registry. npm returns zero results for "everbridge"
  and zero for "snapcomms"; RubyGems and NuGet return zero; the only PyPI package named
  "everbridge" is a community project by an unaffiliated author. The Everbridge GitHub
  organization ships integration utilities and an unrelated ops tool, not API client
  libraries. Integrators are expected to call the REST APIs directly, or to import the
  OpenAPI documents published on the developer hub into Postman/Insomnia — the path the
  Getting Started Guide itself recommends.
